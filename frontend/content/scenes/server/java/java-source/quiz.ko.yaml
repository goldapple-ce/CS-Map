- question: Java Keyword와 Identifier는 어떻게 다른가요?
  answer: Keyword는 `class`, `return`처럼 문법상 의미가 정해진 단어이고, Identifier는 개발자가 Class·Method·변수 등에 붙인 이름입니다.

- question: Local Variable은 Field처럼 자동 기본값을 사용할 수 있나요?
  answer: 아니요. Local Variable은 사용 전에 개발자가 값을 할당해야 하며, Field와 Array 요소는 생성 시 Type에 맞는 기본값을 가집니다.

- question: Java Array는 Primitive Type인가요?
  answer: 아니요. Array는 객체이고 Array 변수에는 Reference Value가 저장됩니다.

- question: Class와 Object는 같은 것인가요?
  answer: 아니요. Class는 객체의 Field와 Method를 정의한 Type이고, Object는 Runtime에 생성된 Instance입니다.

- question: Constructor에는 Return Type을 선언하나요?
  answer: 아니요. Constructor는 Class와 같은 이름을 사용하며 Return Type을 선언하지 않습니다.

- question: Overload와 Override의 차이는 무엇인가요?
  answer: Overload는 같은 이름과 다른 Parameter 목록의 Method를 선언하는 것이고, Override는 Subclass가 상속받은 Instance Method 구현을 다시 정의하는 것입니다.

- question: Reference Type 변수를 다른 변수에 대입하면 객체 전체가 복제되나요?
  answer: 아니요. 객체를 가리키는 Reference Value가 복사되므로 두 변수가 같은 객체를 가리킬 수 있습니다.

- question: Java는 객체를 Method에 Pass-by-Reference로 전달하나요?
  answer: 아니요. 객체를 가리키는 Reference Value를 Pass-by-Value로 전달합니다.

- question: Reference Type에 `==`를 사용하면 객체의 내용이 같은지 비교하나요?
  answer: 아니요. 두 Reference가 같은 객체를 가리키는지 비교하며, 논리적 내용 비교는 Class가 정의한 `equals()`를 사용합니다.

- question: "`i++`와 `++i`는 항상 같은 값을 반환하나요?"
  answer: 아니요. `i++`는 증가 전 값을, `++i`는 증가 후 값을 Expression 결과로 냅니다.

- question: Java에 Class 밖에서 선언하는 전역 변수가 있나요?
  answer: 아니요. Java에는 그런 전역 변수가 없으며, 넓게 공개한 Static Field가 전역 상태처럼 사용될 수 있습니다.

- question: Final Reference가 가리키는 객체는 자동으로 Immutable해지나요?
  answer: 아니요. `final`은 Reference를 다시 대입하지 못하게 할 뿐, 객체 내부 상태의 변경까지 막지는 않습니다.

- question: Package 이름의 한 부분으로 Java Keyword를 사용할 수 있나요?
  answer: 아니요. Package 이름을 구성하는 각 부분도 Identifier이므로 Keyword를 사용할 수 없습니다. `true`, `false`, `null`도 Literal이라 Identifier로 사용할 수 없습니다.

- question: Array의 기본 `toString()` 결과에서 `@` 뒤 값은 실제 Memory 주소인가요?
  answer: 그렇게 단정할 수 없습니다. 기본 `Object.toString()`은 Class 이름과 Hash Code의 16진수 표현을 사용하며, 요소 출력에는 `Arrays.toString()`을 사용합니다.

- question: Anonymous Class가 Reference Local Variable을 Capture하면 객체도 복제되나요?
  answer: 아니요. Final 또는 Effectively Final 변수의 Reference Value가 복사되므로 같은 객체를 가리킬 수 있습니다.

- question: 같은 내용을 가진 서로 다른 두 String 객체는 `==`와 `equals()`가 모두 true인가요?
  answer: 아니요. `==`는 같은 객체를 가리키는지 비교하고, String의 `equals()`는 문자열 내용을 비교합니다.
