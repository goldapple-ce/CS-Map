- question: 동시성이란 무엇인가요? 또한 동시성으로 인해 발생할 수 있는 문제는 무엇인가요?
  answer: |
    동시성이란 여러 작업의 실행이 시간적으로 겹쳐 진행될 수 있도록 구성하는 프로그램 설계 개념입니다.
    Java에서는 주로 멀티스레드를 통해 동시성을 구현하며, 여러 스레드가 독립적인 작업을 함께 진행할 수 있도록 합니다.
    하지만 여러 스레드가 임계 영역 내 공유 가변 상태에 적절한 동기화 없이 접근하면 Race Condition이 나타날 수 있습니다.

- question: Thread Safe란 무엇이며, Java에서 이를 확보하는 방법에는 어떤 것들이 있나요?
  answer: |
    Thread Safe란 멀티스레드 환경에서 여러 스레드가 동일한 객체나 자원에 동시에 접근하더라도 데이터의 일관성을 유지하고 올바르게 동작하는 성질을 의미합니다.
    Java에서는 공유 가변 상태에 대한 접근을 제어하거나, 공유 가변 상태 자체를 최소화하는 방식으로 스레드 안전성을 확보할 수 있습니다.
    대표적으로 Lock 기반 동기화로 상호 배제를 보장하거나, CAS와 Atomic 클래스를 활용하여 Lock 없이 공유 상태를 원자적으로 갱신할 수 있습니다.
    또한 불변성을 통해 객체의 상태 변경을 방지하거나, ThreadLocal을 사용하여 스레드마다 독립적인 상태를 관리함으로써 공유 가변 상태에 대한 경쟁을 줄일 수 있습니다.

- question: Race Condition이란 무엇이며, 어떤 상황에서 발생하나요? Race Condition의 발생 조건과 원인을 중심으로 설명해 보세요.
  answer: |
    Race Condition이란 여러 스레드가 공유 자원에 접근하는 과정에서 실행 순서나 타이밍에 따라 프로그램의 결과가 달라져 예상하지 못한 문제가 발생할 수 있는 상황을 의미합니다.
    단순히 여러 스레드가 공유 자원에 접근한다고 발생하는 것은 아니며, 공유 가변 상태에 대한 읽기 및 쓰기 작업이 적절한 동기화 없이 이루어질 때 발생할 수 있습니다.
    대표적으로 Lost Update가 있습니다.

- question: Lost Update란 무엇이며, 왜 발생하나요? 여러 스레드가 공유 변수에 대해 count++ 연산을 수행한다고 가정하고, Lost Update가 발생하는 과정을 설명해 보세요.
  answer: |
    Lost Update는 여러 스레드가 공유 데이터를 동시에 갱신하는 과정에서 일부 변경 사항이 유실되는 현상으로, Race Condition의 대표적인 사례입니다.
    예를 들어 count++는 현재 값을 읽고, 증가시킨 뒤, 다시 저장하는 복합 연산이므로 원자성이 보장되지 않습니다.
    이때 두 스레드가 동일한 값을 읽고 각각 증가시킨 후 저장한다면, 한 스레드의 갱신 결과가 다른 스레드의 쓰기 작업에 의해 덮어써질 수 있습니다.
    따라서 두 스레드가 각각 값을 1씩 증가시켰음에도 최종 결과가 2가 아닌 1이 되는 Lost Update가 발생할 수 있습니다.

- question: 원자성이란 무엇이며, Java에서 원자성을 보장하는 방법에는 어떤 것들이 있나요? 원자성의 의미와 이를 보장할 수 있는 대표적인 방법을 설명해 보세요.
  answer: |
    원자성이란 하나의 작업이 다른 스레드의 작업에 의해 중간 단계에서 간섭받지 않고, 하나의 불가분한 연산처럼 수행되는 성질을 의미합니다.
    Java에서는 대표적으로 Lock 기반 동기화와 CAS 기반 원자적 연산을 통해 원자성을 보장할 수 있습니다.
    Lock 기반 동기화는 synchronized나 ReentrantLock을 이용하여 임계 영역에 대한 상호 배제를 보장하며, CAS는 Atomic 클래스를 통해 이러한 연산을 사용할 수 있습니다.
    한편 ThreadLocal을 활용하여 스레드마다 독립적인 상태를 관리하거나 불변 객체를 사용하면, 공유 가변 상태에 대한 경쟁 자체를 줄일 수도 있습니다.

- question: CAS란 무엇이며, Lock을 사용하지 않고 어떻게 원자성을 보장할 수 있나요?
  answer: |
    CAS는 Compare-And-Swap의 약자로, 공유 변수의 현재 값과 예상 값을 비교하여 일치하는 경우에만 새로운 값으로 변경하는 원자적 연산입니다.
    여러 스레드가 동일한 공유 변수에 접근하더라도 비교와 변경이 원자적으로 수행되므로, Lock을 이용한 상호 배제 없이 공유 상태를 안전하게 갱신하는 데 활용할 수 있습니다.
    CAS에 실패하면 현재 값을 다시 읽고 재시도하는 방식으로 구현할 수 있으며, Java에서는 AtomicInteger와 같은 Atomic 클래스를 통해 CAS 연산을 사용할 수 있습니다.
    다만 ABA 문제가 발생하면, CAS가 중간 변경을 감지하지 못해 알고리즘의 논리적 오류가 발생할 수 있습니다. 또한 반복적인 CAS 실패로 인해 특정 스레드가 진행하지 못하는 Starvation이 발생할 수도 있습니다.

- question: ABA 문제란 무엇이며, 어떻게 해결할 수 있나요?
  answer: |
    ABA 문제란 CAS를 사용하는 과정에서 공유 변수의 값이 A에서 B로 변경되었다가 다시 A로 돌아오면서, 중간에 발생한 변경을 감지하지 못하는 문제입니다.
    CAS는 현재 값과 예상 값의 일치 여부만 비교하기 때문에, 값이 다시 A로 돌아오면 중간에 변경이 없었던 것으로 판단하여 연산에 성공할 수 있습니다. 이로 인해 원자성 자체는 유지되지만 알고리즘의 논리적 오류가 발생할 수 있습니다.
    이를 해결하기 위해 Java에서는 AtomicStampedReference를 사용하여 참조 값과 버전 번호를 함께 비교하고 갱신할 수 있습니다. 값이 A로 돌아오더라도 버전 번호가 달라지므로 중간 변경을 감지할 수 있습니다.
    또는 Lock 기반 상호 배제를 통해 관련 작업을 보호하여 중간에 다른 스레드가 상태를 변경하지 못하도록 하는 방법도 있습니다.

- question: CAS를 사용하면 항상 스레드 안전성이 보장되나요? CAS가 보장하는 범위와 여러 연산을 조합했을 때 발생할 수 있는 문제를 설명해 보세요.
  answer: |
    CAS를 사용한다고 항상 스레드 안전성이 보장되는 것은 아닙니다.
    CAS는 공유 변수의 비교와 변경을 원자적으로 수행하지만, 여러 연산을 조합한 전체 작업의 원자성까지 보장하지는 않습니다.
    예를 들어 Atomic 클래스의 get과 incrementAndGet은 각각 원자적이지만, 두 연산 사이에 다른 스레드가 개입하면 Check-Then-Act와 같은 Race Condition이 발생할 수 있습니다.
    따라서 스레드 안전성을 보장하려면 개별 연산뿐 아니라 전체 작업의 원자성과 공유 상태의 일관성까지 고려해야 합니다.

- question: 임계 영역이란 무엇이며, 왜 보호해야 하나요?
  answer: |
    임계 영역이란 여러 스레드가 공유 자원에 접근하는 코드 영역 중, 동시 실행으로 인해 Race Condition이 발생할 수 있어 보호가 필요한 영역을 의미합니다.
    임계 영역에서 적절한 동기화 없이 공유 가변 상태를 변경하면 Lost Update와 같은 문제가 발생하여 데이터의 일관성이 깨질 수 있습니다.
    Java에서는 synchronized나 ReentrantLock을 이용한 상호 배제로 임계 영역을 보호할 수 있으며, CAS 기반 Atomic 클래스를 활용해 Lock 없이 공유 상태를 원자적으로 갱신할 수도 있습니다.
    또한 ThreadLocal을 통한 스레드별 상태 격리나 불변 객체를 활용하여 공유 가변 상태 자체를 줄이는 방법도 있습니다.

- question: 상호 배제란 무엇이며, Java에서는 어떻게 구현할 수 있나요?
  answer: |
    상호 배제란 여러 스레드가 동일한 임계 영역을 동시에 실행하지 못하도록 보장하는 성질을 의미합니다.
    Java에서는 대표적으로 synchronized나 ReentrantLock을 이용해 Lock을 획득한 스레드만 임계 영역에 진입하도록 제어하며, 이를 통해 공유 가변 상태에 대한 Race Condition을 방지할 수 있습니다.
    다만 Lock 기반 동기화에서는 Lock 획득을 위한 대기가 발생하며, 잘못된 Lock 관리로 인해 Deadlock이나 Starvation과 같은 진행성 문제가 발생할 수 있습니다.

- question: Deadlock이란 무엇이며, 어떤 조건에서 발생하나요?
  answer: |
    Deadlock이란 여러 스레드가 서로 상대방이 점유한 Lock의 해제를 기다리면서 더 이상 작업을 진행하지 못하는 상태를 의미합니다.
    Deadlock은 상호 배제, 점유 대기, 비선점, 순환 대기라는 네 가지 조건이 동시에 성립할 때 발생할 수 있습니다.
    이를 예방하기 위해서는 네 가지 조건 중 하나 이상이 성립하지 않도록 해야 하며, 대표적으로 Lock 획득 순서를 통일하여 순환 대기를 방지할 수 있습니다. 
    또한 ReentrantLock의 tryLock()을 활용해 Lock 획득에 실패했을 때 기존 Lock을 해제하고 재시도하는 방식도 사용할 수 있습니다.

- question: Livelock이란 무엇이며, Deadlock과 어떤 차이가 있나요?
  answer: |
    Livelock은 여러 스레드가 서로의 동작에 반응하여 계속 상태를 변경하지만, 실제 작업은 진행하지 못하는 상황을 의미합니다.
    Deadlock은 스레드들이 서로 필요한 자원의 해제를 기다리며 진행하지 못하는 반면, Livelock은 스레드들이 계속 동작하거나 재시도하지만 유의미한 진전이 없다는 차이가 있습니다.
    이러한 문제를 방지하기 위해 재시도 횟수를 제한하거나, 무작위 대기 시간인 Backoff를 적용하여 스레드 간 충돌을 줄일 수 있습니다.

- question: Starvation이란 무엇이며, Deadlock과 어떤 차이가 있나요?
  answer: |
    Starvation이란 특정 스레드가 필요한 자원이나 실행 기회를 지속적으로 얻지 못해 작업을 진행하지 못하는 상황을 의미합니다.
    Deadlock은 여러 스레드가 서로 자원을 기다리며 진행하지 못하고, Livelock은 계속 동작하지만 실질적인 진전이 없는 반면, Starvation은 다른 스레드들은 작업을 진행하지만 특정 스레드만 진행하지 못한다는 차이가 있습니다.
    Starvation은 Lock 경쟁이나 스레드 스케줄링의 불공정성 등으로 발생할 수 있으며, Java에서는 ReentrantLock의 Fair Lock을 통해 오래 기다린 스레드에게 우선적으로 Lock 획득 기회를 제공함으로써 발생 가능성을 줄일 수 있습니다.

- question: ReentrantLock은 synchronized와 어떤 차이가 있나요?
  answer: |
    synchronized와 ReentrantLock은 모두 임계 영역에 대한 상호 배제를 보장하는 재진입 가능한 Lock 기반 동기화 방식입니다.
    synchronized는 객체의 모니터 락을 이용하며, 블록이나 메서드의 진입과 종료에 따라 Lock이 자동으로 획득되고 해제됩니다. 
    반면 ReentrantLock은 AQS를 기반으로 구현되며, Lock의 획득과 해제를 명시적으로 제어할 수 있습니다.
    또한 ReentrantLock은 Fair Lock을 통한 공정성 설정, tryLock()을 통한 타임아웃 및 비차단 획득 시도, lockInterruptibly()를 통한 인터럽트 처리, 유연한 Lock 범위 제어 등의 기능을 제공합니다.
    따라서 단순한 상호 배제에는 synchronized를 사용할 수 있으며, Lock 획득 정책이나 대기 방식을 세밀하게 제어해야 하는 경우 ReentrantLock을 고려할 수 있습니다.

- question: synchronized는 내부적으로 어떻게 동작하나요?
  answer: |
    synchronized는 객체의 모니터 락을 이용하여 임계 영역에 대한 상호 배제를 보장하는 동기화 방식입니다.
    스레드가 synchronized 영역에 진입할 때 해당 객체의 모니터 락을 획득하며, 다른 스레드가 동일한 락을 획득하려 하면 락이 해제될 때까지 대기합니다.
    또한 재진입을 지원하므로 이미 락을 보유한 스레드는 동일한 락을 다시 획득할 수 있으며, synchronized 영역을 벗어나면 획득한 락이 해제됩니다.
    synchronized는 상호 배제뿐 아니라 JMM의 Happens-Before 관계를 통해 스레드 간 메모리 가시성도 보장합니다.

- question: ReentrantLock은 내부적으로 어떻게 동작하나요?
  answer: |
    ReentrantLock은 AQS를 기반으로 구현된 재진입 가능한 Lock 객체로, CAS와 state를 이용하여 Lock의 획득 상태를 관리합니다.
    스레드가 Lock 획득을 시도할 때 state가 0이면 CAS를 통해 Lock 획득을 시도하며, 다른 스레드가 이미 Lock을 보유하고 있다면 AQS의 대기 큐에 진입하여 대기합니다.
    또한 Lock을 보유한 스레드는 재진입할 수 있으며, 이때 state가 증가합니다.
    반대로 unlock을 호출하면 state가 감소하고, 0이 되면 Lock이 완전히 해제되어 대기 중인 스레드가 다시 Lock 획득을 시도할 수 있습니다.

- question: Semaphore란 무엇이며, ReentrantLock과 어떤 차이가 있나요?
  answer: |
    Semaphore는 여러 스레드가 공유 자원에 동시에 접근할 수 있는 수를 Permit으로 제한하는 동기화 도구입니다.
    스레드가 acquire를 호출하면 Permit을 획득하고, 사용 가능한 Permit이 없다면 반환될 때까지 대기합니다. 작업이 끝나면 release를 통해 Permit을 반환하여 다른 스레드가 접근할 수 있도록 합니다.
    ReentrantLock은 상호 배제를 통해 한 번에 하나의 스레드만 임계 영역에 진입하도록 제어하는 반면, Semaphore는 Permit의 개수만큼 여러 스레드의 동시 접근을 허용할 수 있습니다.
    또한 ReentrantLock은 Lock의 소유권이 존재하지만, Semaphore는 소유권이 없다는 차이가 있습니다. Permit이 1개라면 상호 배제를 구현할 수도 있습니다.

- question: ThreadLocal이란 무엇이며, 동시성 문제를 어떻게 방지하나요?
  answer: |
    ThreadLocal은 각 스레드가 독립적인 값을 저장하고 사용할 수 있도록 제공하는 Java 클래스입니다.
    일반적인 객체의 필드는 여러 스레드가 동일한 객체를 참조하면 값이 공유될 수 있지만, ThreadLocal은 동일한 인스턴스에 접근하더라도 각 스레드의 ThreadLocalMap을 통해 서로 다른 값을 관리합니다.
    따라서 Lock 기반 동기화가 공유 가변 상태에 대한 접근을 제어하는 방식이라면, ThreadLocal은 스레드마다 상태를 격리하여 공유 가변 상태로 인한 Race Condition을 방지하는 방식입니다.

- question: ThreadLocal을 스레드 풀 환경에서 사용할 때 주의해야 할 점은 무엇인가요?
  answer: |
    ThreadLocal은 작업 단위가 아니라 스레드 단위로 값을 유지합니다.
    따라서 스레드 풀처럼 동일한 스레드를 여러 작업에서 재사용하는 환경에서는 이전 작업의 데이터가 다음 작업에 남아 데이터 오염이 발생할 수 있습니다.
    또한 ThreadLocalMap에 저장된 값이 장시간 유지되면 불필요한 메모리 점유나 메모리 누수로 이어질 수 있습니다.
    이를 방지하기 위해 작업이 완료되면 remove()를 호출해야 하며, 예외가 발생하더라도 정리되도록 try-finally를 사용하는 것이 좋습니다.

- question: 불변 객체는 무엇이며, 동시성 환경에서 어떤 장점이 있나요?
  answer: |
    불변 객체란 생성 이후 내부 상태를 변경할 수 없도록 설계된 객체를 의미합니다.
    불변 객체는 여러 스레드가 동일한 객체를 공유하더라도 상태가 변경되지 않으므로, 공유 가변 상태에서 발생하는 Race Condition을 예방할 수 있습니다.
    따라서 적절하게 생성되고 안전하게 공개된 불변 객체는 별도의 Lock이나 동기화 없이 여러 스레드에서 안전하게 읽을 수 있으며, Thread Safety를 확보하는 데 유리합니다.

- question: 스레드 안전성을 확보했다면 Deadlock이나 Starvation 같은 동시성 문제도 발생하지 않을까요?
  answer: |
    스레드 안전성을 확보하더라도 Deadlock이나 Starvation과 같은 동시성 문제는 발생할 수 있습니다.
    스레드 안전성은 여러 스레드가 공유 자원에 접근하더라도 데이터의 일관성과 올바른 동작을 유지하는 Safety 관점의 성질이며, Deadlock과 Starvation은 스레드가 정상적으로 작업을 진행할 수 있는지를 다루는 Liveness 문제입니다.
    예를 들어 Lock 기반 동기화로 상호 배제를 보장하더라도, 여러 스레드가 서로의 Lock 해제를 기다리면서 Deadlock이 발생할 수 있습니다.
    또한 Starvation은 Lock 경쟁뿐 아니라 Lock-free 알고리즘에서 반복적인 CAS 실패로 인해 발생할 수도 있습니다.
    따라서 동시성 환경에서는 데이터의 안전성뿐 아니라 작업의 진행성도 함께 고려해야 합니다.

- question: Lock-free 알고리즘에서도 Starvation이 발생할 수 있는 이유는 무엇인가요?
  answer: |
    Lock-free는 Lock을 사용하지 않고 CAS와 같은 원자적 연산을 활용하여 공유 상태를 안전하게 처리하는 비차단 동시성 알고리즘입니다.
    여러 스레드가 공유 자원에 대해 경쟁하더라도 시스템 전체에서는 지속적인 작업 진행을 보장하지만, 개별 스레드의 작업 완료까지 보장하지는 않습니다.
    따라서 특정 스레드가 CAS에 반복적으로 실패하여 작업을 완료하지 못하는 Starvation이 발생할 수 있습니다.
    반면 Wait-free는 각 스레드의 연산이 유한한 단계 안에 완료되도록 보장한다는 차이가 있습니다.

- question: Lock-free와 Wait-free는 어떤 차이가 있나요?
  answer: |
    Lock-free와 Wait-free는 모두 Lock을 사용하지 않는 비차단 동시성 알고리즘이지만, 작업의 진행 보장 범위에 차이가 있습니다.
    Lock-free는 여러 스레드가 경쟁하더라도 시스템 전체에서 지속적인 작업 진행을 보장하지만, 개별 스레드의 작업 완료까지 보장하지는 않습니다. 따라서 특정 스레드가 CAS에 반복적으로 실패하면서 Starvation이 발생할 수 있습니다.
    반면 Wait-free는 각 스레드의 연산이 유한한 단계 안에 완료되도록 보장하므로, 알고리즘 내부의 경쟁으로 인한 Starvation을 방지할 수 있습니다.

- question: AtomicInteger의 CAS 기반 갱신과 ReentrantLock의 CAS 기반 Lock 획득은 어떤 차이가 있나요?
  answer: |
    AtomicInteger와 ReentrantLock은 모두 CAS를 활용하지만, CAS의 사용 목적과 작업의 진행 방식에 차이가 있습니다.
    AtomicInteger는 CAS를 통해 공유 변수의 값을 직접 원자적으로 갱신하며, 경쟁이 발생하면 재시도하는 방식으로 Lock 없이 작업을 수행할 수 있습니다.
    반면 ReentrantLock은 AQS의 state를 CAS로 변경하여 Lock을 획득하고, 상호 배제를 통해 임계 영역을 보호합니다. 이때 Lock을 획득하지 못한 스레드는 다른 스레드가 Lock을 해제할 때까지 대기할 수 있습니다.
    따라서 AtomicInteger의 CAS 기반 갱신은 Lock-free 방식으로 구현할 수 있지만, ReentrantLock은 CAS를 사용하더라도 Lock 소유자에게 작업의 진행이 의존하는 Lock 기반 동기화 방식입니다.

- question: Lock을 사용하지 않으면 항상 성능이 더 좋을까요?
  answer: |
    Lock을 사용하지 않는다고 항상 성능이 더 좋은 것은 아닙니다.
    CAS 기반 Lock-free 알고리즘은 Lock 획득과 해제에 따른 오버헤드를 피할 수 있지만, 여러 스레드가 동일한 공유 자원에 대해 경쟁하면 CAS 실패와 재시도가 반복되어 CPU 사용량이 증가하고 성능이 저하될 수 있습니다.
    반면 Lock 기반 동기화는 상호 배제를 통해 공유 자원에 대한 접근을 제어하며, 경쟁이 심한 상황에서는 스레드를 대기시켜 불필요한 재시도 비용을 줄일 수 있습니다.

- question: 공유 가변 상태를 다룰 때 Lock, Atomic 클래스, ThreadLocal 중 어떤 방법을 선택해야 하나요?
  answer: |
    공유 가변 상태를 안전하게 관리하기 위해서는 데이터의 공유 여부와 원자성을 보장해야 하는 작업의 범위를 기준으로 적절한 방법을 선택해야 합니다.
    스레드 간 데이터를 공유할 필요가 없고 스레드별로 독립적인 상태를 유지해야 한다면 ThreadLocal을 활용할 수 있습니다.
    반면 단일 공유 변수에 대한 원자적 갱신으로 데이터의 일관성을 보장할 수 있다면 CAS 기반 Atomic 클래스를 사용할 수 있습니다.
    여러 공유 변수나 복합 연산을 하나의 원자적인 작업으로 보호해야 한다면 synchronized나 ReentrantLock을 이용한 상호 배제를 고려할 수 있습니다.
    또한 상태 변경 자체가 필요하지 않다면 불변 객체를 통해 공유 가변 상태를 제거하는 방법도 있습니다.
