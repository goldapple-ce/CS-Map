- question: Young GC가 발생하면 Application Thread는 계속 실행되나요? Stop-The-World가 필요한 이유는 무엇인가요?
  answer: |
    일반적인 세대형 Collector의 Young GC에서는 Application Thread가 일시 정지할 수 있습니다. 이 상태를 Stop-The-World라고 합니다.

    객체를 이동하고 Reference를 고치는 동안 일관된 상태를 유지해야 하기 때문입니다. 최신 Collector는 동시에 수행하는 작업을 늘려 pause를 줄이지만 일부 정지 구간은 남을 수 있습니다.

- question: JVM이 Application Thread를 Safepoint에서 정지시키는 이유는 무엇인가요?
  answer: |
    Safepoint는 JVM이 Thread의 실행 상태와 Reference 위치를 안전하게 파악하며 멈출 수 있는 지점입니다.

    임의의 명령 실행 중에 바로 멈추기보다 GC가 필요한 상태를 정확히 확인할 수 있는 지점에 Thread가 도달한 뒤 정지시킵니다. Safepoint는 안전하게 멈출 수 있는 지점이고, Stop-The-World는 Application Thread들이 실제로 멈춰 있는 상태입니다.

- question: Young GC, Major GC, Full GC는 항상 순서대로 실행되는 단계인가요?
  answer: |
    아닙니다. Young GC는 주로 Young Generation을 수집하고, Full GC는 일반적으로 Young과 Old를 포함한 넓은 범위를 수집합니다.

    Major GC는 흔히 Old Generation 수집을 뜻하지만 Collector와 도구에 따라 범위가 다를 수 있습니다. 이 이름들은 고정된 실행 순서가 아니므로 실제 수집 범위는 GC Log와 해당 Collector 문서로 확인해야 합니다.

- question: 코드에서 System.gc()를 호출하면 Full GC가 반드시 즉시 실행되나요?
  answer: |
    아닙니다. `System.gc()`는 JVM에 GC를 요청할 뿐 즉시 또는 반드시 실행된다고 보장하지 않습니다.

    JVM과 Collector 설정에 따라 큰 수집과 긴 pause로 이어질 수 있으므로 운영 코드에서 GC 시점을 직접 통제하려고 무분별하게 호출하면 응답 시간에 악영향을 줄 수 있습니다.

- question: Young GC가 Old Generation 전체를 매번 탐색하지 않고도 Old 객체가 가리키는 Young 객체를 찾는 방법은 무엇인가요?
  answer: |
    Reference가 바뀔 때 Write Barrier가 Card Table이나 Remembered Set에 필요한 추적 정보를 갱신합니다.

    Young GC는 이 기록을 추가 탐색 정보로 사용해 Old 전체가 아니라 관련 구역이나 외부 Reference를 확인하고, Old 객체에서 도달 가능한 Young 객체를 살아 있는 객체로 판단합니다.

- question: Card Table과 Remembered Set은 같은 자료구조인가요?
  answer: |
    같은 개념은 아닙니다. Card Table은 Reference 변경이 있었던 Memory 구역을 표시하고, Remembered Set은 특정 수집 영역으로 외부에서 들어오는 Reference 정보를 관리하는 데 초점을 둡니다.

    구현에서는 Card 단위 정보가 Remembered Set을 구성하거나 갱신하는 데 사용될 수 있습니다.

- question: Write Barrier의 비용을 감수하면서 Reference 변경을 기록하는 이유는 무엇인가요?
  answer: |
    Reference를 쓸 때 조건 검사와 추가 Memory 쓰기 같은 작은 Runtime 비용이 발생합니다.

    대신 GC가 Old Generation이나 Heap 전체를 다시 탐색하지 않고 필요한 부분을 찾을 수 있어 수집 작업과 pause를 줄일 수 있습니다. 평상시의 작은 분산 비용으로 GC 시점의 큰 탐색 비용을 줄이는 선택입니다.

- question: Concurrent Marking 중 Reference 관계가 바뀌어도 GC가 살아 있는 객체를 놓치지 않는 방법은 무엇인가요?
  answer: |
    Collector는 Application이 Reference를 바꿀 때 Barrier로 변경 정보를 기록하고 Mark 결과에 반영합니다.

    SATB는 Mark 시작 시점의 객체 관계를 보존하는 관점으로 이전 Reference를 기록하고, Incremental Update는 Mark 중 새롭게 생긴 관계를 반영하는 관점입니다. 사용하는 방식과 세부 구현은 Collector마다 다릅니다.

- question: GC가 자주 발생하면 곧바로 Memory Leak이라고 판단할 수 있나요?
  answer: |
    아닙니다. Allocation Rate가 높아 짧게 사는 객체를 빠르게 만들고 버리는 Application도 Young GC가 자주 발생할 수 있습니다.

    GC 빈도만 보지 말고 pause, GC 전후 Heap 사용량과 회수량, Allocation Rate, Old 영역의 증가 추세를 함께 확인해야 합니다.

- question: Mark는 Garbage 객체에 표시하는 작업인가요?
  answer: |
    핵심은 GC Roots에서 Reference를 따라가며 **살아 있는 객체를 식별하는 것**입니다.

    Mark 탐색으로 도달하지 못한 객체가 이후 Sweep 등의 Memory 회수 대상이 될 수 있습니다. 객체끼리 순환 참조해도 GC Roots에서 도달할 수 없다면 살아 있는 객체로 표시되지 않습니다.

- question: Sweep, Compact, Copy는 Memory를 어떤 방식으로 확보하나요?
  answer: |
    - Sweep는 수집 대상이 사용하던 공간을 다시 사용할 수 있게 만듭니다.
    - Compact는 살아 있는 객체를 모아 흩어진 빈 공간을 줄입니다.
    - Copy는 살아 있는 객체만 다른 영역으로 옮기고 기존 영역을 비웁니다.

    Compact와 Copy는 객체를 이동하므로 Reference 갱신이 필요합니다. Copy는 수집 영역에 살아 있는 객체가 적을 때 옮길 객체가 적어 유리할 수 있습니다.
