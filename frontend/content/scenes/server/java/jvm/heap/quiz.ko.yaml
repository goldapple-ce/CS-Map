- question: 하나의 JVM Process 안에서 Thread마다 서로 다른 Heap을 사용하나요?
  answer: 아니요. 여러 Thread가 같은 Heap을 공유합니다.

- question: S0와 S1은 Garbage Collection마다 어떤 관계로 동작하나요?
  answer: 한쪽이 From, 다른 쪽이 To Survivor 역할을 맡고 Garbage Collection이 끝날 때마다 역할을 교대합니다.

- question: JVM은 왜 Heap을 Young Generation과 Old Generation으로 구분할까요?
  answer: |
    JVM이 Heap을 Young Generation과 Old Generation으로 구분하는 이유는 세대 가설 때문입니다.
    약한 세대 가설은 대부분의 객체가 생성된 지 얼마 지나지 않아 Garbage가 된다는 것이고, 강한 세대 가설은 오래 살아남은 객체일수록 앞으로도 살아남을 가능성이 높다는 것입니다.
    JVM은 이러한 특성을 활용해 새로 생성된 객체를 Young Generation에 배치하고 자주 GC를 수행합니다. 반면 여러 번의 GC에서 살아남은 객체는 Old Generation으로 승격시켜 상대적으로 적은 빈도로 GC를 수행합니다.
    이를 통해 불필요한 객체 탐색을 줄이고 GC 효율을 높일 수 있습니다.

- question: Eden에서 생성된 객체가 계속 살아남으면 일반적으로 어떤 과정을 거쳐 Old Generation으로 이동하나요?
  answer: |
    1. 객체는 일반적으로 Eden에 생성됩니다.
    2. Young GC에서 살아남으면 Survivor 영역으로 복사되고 age가 증가합니다.
    3. 이후 GC에서도 계속 살아남아 age가 승격 임계값에 도달하면 Old Generation으로 Promotion됩니다.

    다만 Survivor 공간이 부족하거나 객체가 큰 경우에는 더 일찍 Promotion될 수 있으며, 세부 동작은 Collector에 따라 달라집니다.

- question: 운영 중인 Java 애플리케이션의 Heap 사용량이 계속 증가한다면, Memory Leak 여부를 어떤 순서와 도구로 진단하겠습니까?
  answer: |
    먼저 APM과 GC Log를 통해 Heap 사용량이 GC 이후에도 계속 증가하는지 확인합니다. 단순히 Heap 사용량이 순간적으로 높아지는 것보다, Full GC 이후에도 살아남는 객체의 기준선이 지속적으로 상승하는지가 중요합니다.
    Memory Leak이 의심되면 jcmd, jmap 등을 이용해 Heap Dump를 생성합니다. 이후 Eclipse MAT, VisualVM, JProfiler 같은 도구로 객체 수, Shallow Size, Retained Size, Dominator Tree를 분석합니다.
    특히 메모리를 많이 점유하는 객체가 무엇인지 확인한 뒤 Path to GC Roots를 추적하여 어떤 Static Field, ThreadLocal, Cache, Listener 등이 해당 객체의 참조를 계속 유지하고 있는지 찾습니다. 필요하면 서로 다른 시점의 Heap Dump를 비교해 지속적으로 증가하는 객체를 확인합니다.
    운영 환경에서 Heap Dump를 생성하면 애플리케이션 정지나 큰 디스크 사용이 발생할 수 있으므로 충분한 저장 공간과 서비스 영향을 확인해야 합니다.

- question: Heap Dump 분석에서 Shallow Size와 Retained Size는 무엇이 다르며, 메모리 누수 원인을 찾을 때 Retained Size가 중요한 이유는 무엇인가요?
  answer: |
    Shallow Size는 특정 객체 자체가 직접 차지하는 메모리 크기입니다. Retained Size는 해당 객체가 제거될 경우 함께 도달 불가능해져 회수될 수 있는 객체들의 메모리까지 포함한 크기입니다.
    메모리 누수의 원인이 되는 객체는 자기 크기보다 많은 객체를 참조하여 유지하는 경우가 많으므로, Shallow Size만으로는 실제 영향도를 알기 어렵습니다.
    따라서 Retained Size와 GC Root 경로를 함께 분석해야 합니다.

- question: Java 객체를 생성하면 항상 Heap에 할당될까요? Escape Analysis와 관련하여 설명해 주세요.
  answer: |
    JVM 명세 관점에서는 객체가 Heap에 생성된다고 설명합니다. 하지만 JIT Compiler는 Escape Analysis를 통해 객체가 현재 메서드나 Thread 밖으로 노출되는지 분석할 수 있습니다.
    객체가 외부로 Escape하지 않는다고 판단되면 객체의 필드를 개별 지역 값으로 분해하는 Scalar Replacement를 적용하여 객체 할당 자체를 제거할 수 있습니다. 객체에 사용된 Lock이 다른 Thread와 공유되지 않는다고 판단하면 Lock Elision을 적용할 수도 있습니다.
    따라서 소스 코드에는 객체 생성이 있어도 최적화된 Machine Code에서는 실제 Heap 객체가 생성되지 않을 수 있습니다. 다만 Escape Analysis가 적용됐다고 해서 모든 객체가 자동으로 Stack에 할당된다고 단정해서는 안 됩니다.

- question: JVM이 Heap에 객체를 빠르게 할당하기 위해 사용하는 TLAB(Thread-Local Allocation Buffer)이란 무엇이며, 왜 필요한가요?
  answer: |
    TLAB은 JVM이 각 Thread에 미리 할당하는 Heap 내부의 작은 전용 할당 영역입니다. 일반적으로 Young Generation의 Eden 영역 일부를 Thread별로 나누어 제공합니다.
    각 Thread는 자신의 TLAB 안에서 포인터를 이동시키는 방식으로 객체를 빠르게 생성할 수 있습니다. 다른 Thread와 객체 할당 위치를 공유하지 않으므로 대부분의 작은 객체를 생성할 때 매번 Lock이나 원자적 연산으로 할당 위치를 조정할 필요가 줄어듭니다.
    TLAB 공간이 부족하면 Thread는 새로운 TLAB을 할당받거나 공유 영역에 객체를 할당할 수 있으며, 큰 객체는 TLAB 밖에 직접 할당될 수 있습니다. TLAB은 할당 과정만 Thread별로 분리할 뿐, 생성된 객체 자체는 일반적인 Heap 객체이므로 다른 Thread와 공유될 수 있습니다.
