- question: Java Memory Model(JMM)이란 무엇이며, 왜 필요한가요?
  answer: |
    JMM(Java Memory Model)은 멀티스레드 환경에서 공유 변수에 대한 가시성, 원자성, 명령어 실행 순서를 정의하는 메모리 모델입니다.
    이 중 가시성과 순서 보장을 판단하는 핵심 기준이 happens-before 관계입니다.
    두 동작 사이에 이 관계가 성립하면 앞선 작업의 메모리 변경 결과가 뒤따르는 작업에서 보이도록 보장되며, 해당 관계를 위반하는 명령어 재정렬도 허용되지 않습니다.

- question: 한 스레드가 일반 변수의 값을 변경한 다음 volatile 변수에 값을 기록했습니다. 다른 스레드가 그 volatile 변수를 읽었다면, 앞서 변경한 일반 변수의 값도 볼 수 있을까요? 가능하다면 JMM 관점에서 그 이유를 설명해 주세요.
  answer: |
    네, 볼 수 있습니다. 스레드 A에서 일반 변수를 변경한 후 volatile 변수에 값을 기록하고, 스레드 B가 해당 volatile 값을 읽으면 두 연산 사이에 synchronizes-with 관계가 성립합니다.
    여기에 프로그램 순서 규칙과 전이성이 적용되어 happens-before 관계가 성립하므로, 앞서 변경한 일반 변수의 가시성도 보장됩니다.

- question: JMM에서는 명령어 재정렬을 허용하는데, JVM이나 CPU가 명령어를 재정렬하는 이유는 무엇인가요? 그리고 멀티스레드 환경에서 명령어 재정렬이 문제가 되는 경우는 언제이며, 이를 어떻게 방지할 수 있을까요
  answer: |
    명령어 재정렬은 JVM이나 CPU가 실행 성능을 최적화하기 위해 연산 순서를 변경하는 것입니다.
    단일 스레드에서는 실행 결과가 유지되지만, 멀티스레드 환경에서는 재정렬로 인해 다른 스레드가 예상하지 못한 값을 관찰할 수 있습니다.
    이를 방지하기 위해 volatile이나 synchronized 등을 사용하여 happens-before 관계를 형성하고, 필요한 가시성과 실행 순서를 보장할 수 있습니다.

- question: 멀티스레드 환경에서 한 스레드가 객체를 생성하고 초기화한 뒤, 해당 객체의 참조를 다른 스레드와 공유한다고 가정하겠습니다. 이때 다른 스레드가 객체의 참조는 정상적으로 읽었지만, 객체의 필드 값은 초기화되기 전의 기본값으로 읽을 수도 있을까요? 가능하다면 그 이유는 무엇이고, 이를 방지하려면 어떻게 해야 할까요?
  answer: |
    네, 가능합니다. 객체를 생성하는 스레드와 참조를 읽는 스레드 사이에 happens-before 관계가 없다면, 객체의 참조는 관찰하더라도 일반 필드의 초기화된 값까지 관찰한다는 보장은 없습니다.
    이를 방지하려면 volatile이나 synchronized를 통해 happens-before 관계를 형성하여 객체를 안전하게 공개해야 합니다. 
    또한 final 필드는 객체가 올바르게 생성되었다면 Freeze Action을 통해 초기화된 값의 가시성을 보장받을 수 있습니다.

- question: volatile은 어떤 상황에서 사용하나요? volatile만으로 동시성 문제를 모두 해결할 수 있을까요?
  answer: |
    volatile은 멀티스레드 환경에서 공유 변수의 가시성을 보장하고, 메모리 가시성과 관련된 명령어 재정렬을 제한하기 위해 사용합니다.
    한 스레드에서 volatile 변수에 기록한 값은 다른 스레드가 해당 변수를 읽을 때 확인할 수 있으며, volatile 쓰기와 이후의 읽기 사이에는 happens-before 관계가 성립합니다.
    다만 volatile은 원자성을 보장하지 않습니다. 예를 들어 여러 스레드가 공유 변수를 동시에 증가시키는 경우, 읽기와 수정, 쓰기가 하나의 원자적 연산으로 수행되지 않기 때문에 갱신 손실이 발생할 수 있습니다.

- question: Java에서 스레드 간 협력이 필요할 때 사용하는 wait()과 notify()는 각각 어떤 역할을 하나요? 또한 wait()과 sleep()은 어떤 차이가 있는지, 특히 락의 관점에서 설명해 주세요.
  answer: |
    wait()과 notify()는 스레드 간 협력을 위해 사용하는 메서드입니다. wait()은 현재 스레드가 보유한 객체의 모니터 락을 해제하고 대기하도록 만들며, notify()는 해당 객체에서 대기 중인 스레드 하나에 신호를 보냅니다.
    반면 sleep()은 일정 시간 동안 스레드의 실행을 중단하지만, 보유한 락을 해제하지는 않습니다.
    따라서 두 메서드의 가장 큰 차이는 스레드 간 협력을 위한 기능인지, 그리고 락을 해제하는지 여부입니다

- question: 싱글톤 객체를 지연 초기화하면서 동기화 비용을 줄이기 위해 Double-Checked Locking 패턴을 사용한다고 가정하겠습니다. 이때 싱글톤 인스턴스를 저장하는 변수에 volatile을 선언하지 않으면 어떤 문제가 발생할 수 있을까요? 그리고 volatile을 선언하면 그 문제가 해결되는 이유는 무엇인가요?
  answer: |
    Double-Checked Locking에서 인스턴스 변수에 volatile이 없다면 명령어 재정렬과 가시성 문제로 다른 스레드가 초기화가 완료되지 않은 객체를 관찰할 수 있습니다.
    volatile을 사용하면 쓰기와 읽기 사이에 happens-before 관계가 성립하여 객체 초기화 결과의 가시성과 필요한 순서를 보장할 수 있습니다

- question: JMM의 Program Order 규칙에 따르면 동일한 스레드에서 앞선 작업은 뒤따르는 작업보다 happens-before 관계에 있습니다. 그런데 JMM은 성능 최적화를 위한 명령어 재정렬도 허용합니다. 그렇다면 happens-before로 순서가 보장되는데 명령어 재정렬은 어떻게 가능한 걸까요?
  answer: |
    Program Order는 동일한 스레드에서 앞선 작업이 뒤따르는 작업보다 happens-before 관계에 있음을 보장합니다.
    다만 이는 실제 명령어 실행 순서를 강제하는 것이 아니라 논리적인 순서를 보장하는 것이므로, 단일 스레드의 실행 결과를 유지하는 범위에서 명령어 재정렬이 가능합니다.
    서로 다른 스레드에서는 추가적인 동기화가 없다면 이러한 순서와 가시성이 보장되지 않을 수 있습니다.

- question: 스레드 A가 synchronized 블록 안에서 일반 변수의 값을 변경하고 락을 해제했습니다. 이후 스레드 B가 동일한 락을 획득하여 해당 일반 변수를 읽는다면, A가 변경한 값을 볼 수 있을까요? 가능하다면 happens-before 관점에서 그 이유를 설명해 주세요.
  answer: |
    네, 가능합니다. synchronized는 동일한 모니터 락을 사용하는 스레드 사이에서 상호 배제와 메모리 가시성을 보장합니다.
    특히 모니터 락의 해제와 이후 동일한 락의 획득 사이에는 synchronizes-with 관계가 성립합니다. 
    따라서 happens-before 관계를 통해 이전 스레드가 변경한 일반 변수의 가시성과 순서가 보장됩니다.

- question: 스레드 A가 synchronized를 사용해 일반 변수를 변경하고 락을 해제했습니다. 그런데 스레드 B는 A와 다른 객체의 모니터 락을 획득한 후 해당 일반 변수를 읽습니다. 이 경우에도 A가 변경한 값의 가시성이 보장될까요? happens-before 관점에서 설명해 주세요.
  answer: |
    아니요, 보장되지 않습니다. synchronized의 synchronizes-with 관계는 동일한 모니터 락의 해제와 이후 획득 사이에서 성립합니다.
    서로 다른 락을 사용하면 해당 규칙에 따른 happens-before 관계가 성립하지 않으므로, 별도의 동기화가 없다면 일반 변수의 가시성을 보장할 수 없습니다.

- question: 스레드 A가 일반 변수의 값을 변경한 뒤, 새로운 스레드 B를 start()로 실행했다고 가정하겠습니다. 이때 스레드 B는 A가 변경한 일반 변수의 값을 볼 수 있을까요? 가능하다면 volatile이나 synchronized를 사용하지 않았는데도 가시성이 보장되는 이유를 happens-before 관점에서 설명해 주세요
  answer: |
    네, 가능합니다. 스레드 A에서 일반 변수를 변경한 후 스레드 B를 시작하면, Program Order에 의해 변수 변경이 start() 호출보다 먼저 발생합니다.
    또한 Thread.start()와 시작된 스레드의 동작 사이에는 synchronizes-with 관계가 성립합니다.
    따라서 happens-before의 추이성에 의해 일반 변수의 변경 결과가 스레드 B에서도 보이도록 보장됩니다.

- question: 멀티스레드 환경에서 두 스레드가 동일한 일반 변수에 접근하지만, 두 스레드 사이에 happens-before 관계가 성립하지 않는다고 가정하겠습니다. 이 경우 반드시 가시성 문제가 발생할까요? 그리고 happens-before 관계가 없다는 것과 데이터 경합(Data Race)이 발생한다는 것은 같은 의미일까요?
  answer: |
    happens-before 관계가 없다고 해서 반드시 가시성 문제가 발생하는 것은 아닙니다. 다만 다른 스레드의 변경 결과를 관찰한다는 보장이 없습니다.
    데이터 경합은 서로 다른 스레드가 동일한 변수에 접근하고, 적어도 하나가 쓰기 작업이며, 두 접근 사이에 happens-before 관계가 없을 때 발생합니다.
    따라서 happens-before 관계가 없다는 것만으로 데이터 경합이라고 판단할 수는 없습니다.

- question: happens-before 관계가 성립하면 가시성과 순서가 보장된다고 배웠습니다. 그렇다면 happens-before 관계가 성립하는 두 스레드 사이에서는 원자성 문제도 해결될까요? 그렇지 않다면 그 이유는 무엇일까요?
  answer: |
    happens-before는 두 동작 사이의 가시성과 순서를 보장하지만, 복합 연산의 원자성 자체를 보장하지는 않습니다.
    예를 들어 count++는 읽기, 수정, 쓰기로 구성되기 때문에 여러 스레드가 동시에 실행하면 연산이 서로 뒤섞여 갱신 손실이 발생할 수 있습니다.
    따라서 복합 연산의 원자성을 보장하려면 synchronized, Lock, AtomicInteger 등의 동기화 수단을 사용해야 합니다.

- question: 공유 변수의 값을 증가시키는 작업이 읽기, 수정, 쓰기로 이루어진다고 가정하겠습니다. 이때 각 읽기와 쓰기 작업에만 개별적으로 synchronized를 적용한다면 원자성을 보장할 수 있을까요? 보장할 수 없다면 그 이유는 무엇일까요?
  answer: |
    아니요. synchronized는 동일한 모니터 락을 사용하는 임계 영역에 대해 상호 배제를 보장합니다.
    하지만 읽기와 쓰기에 개별적으로 적용하면 두 작업 사이에 다른 스레드가 개입할 수 있으므로 복합 연산의 원자성은 보장되지 않습니다.
    따라서 원자성을 보장하려면 읽기, 수정, 쓰기 전체를 하나의 synchronized 블록으로 보호해야 합니다.

- question: 스레드 A가 volatile 변수에 true를 기록한 다음, 일반 변수의 값을 변경했다고 가정하겠습니다. 스레드 B는 해당 volatile 변수에서 true를 읽은 후 일반 변수의 값을 확인합니다. 이 경우 스레드 B는 A가 변경한 일반 변수의 값을 반드시 볼 수 있을까요? happens-before와 Program Order 관점에서 설명해 주세요.
  answer: |
    아니요, 보장되지 않습니다. volatile 쓰기와 이후 읽기 사이에는 synchronizes-with 관계가 성립하지만, 일반 변수의 변경이 volatile 쓰기보다 나중에 발생하기 때문입니다.
    happens-before의 추이성을 통해 일반 변수의 가시성을 보장하려면, 스레드 A에서 일반 변수를 먼저 변경하고 이후 volatile 변수에 기록해야 합니다.

- question: Java에서 final 필드는 volatile이나 synchronized를 사용하지 않아도 다른 스레드에서 초기화된 값을 관찰할 수 있도록 특별한 보장을 제공한다고 합니다. 이것이 가능한 이유는 무엇이고, 일반 필드와 어떤 차이가 있을까요?
  answer: |
    final 필드는 생성자가 종료될 때 발생하는 Freeze Action을 통해 특별한 메모리 가시성을 보장받습니다.
    따라서 객체가 생성 중 외부로 노출되지 않고 정상적으로 초기화되었다면, 다른 스레드는 별도의 동기화 없이도 final 필드의 초기화된 값을 관찰할 수 있습니다.

- question: 그렇다면 final 참조가 가리키는 객체의 일반 필드를 생성자 완료 이후에 변경했다면, 다른 스레드에서도 그 변경된 값의 가시성이 보장될까요?
  answer: |
    아니요. final의 Freeze Action은 생성자 종료 시점까지 수행한 초기화 작업에 특별한 가시성 보장을 제공합니다.
    하지만 생성자 종료 이후 참조 대상 객체의 일반 필드를 변경하는 작업까지 보장하지는 않습니다. 따라서 이후 변경한 값의 가시성을 보장하려면 별도의 동기화가 필요합니다.

- question: 어떤 객체를 참조하는 변수에 volatile을 선언했다고 가정하겠습니다. 그렇다면 해당 참조가 가리키는 객체의 일반 필드들도 자동으로 volatile처럼 가시성을 보장받을까요? 그 이유를 JMM의 happens-before 관점에서 설명해 주세요.
  answer: |
    volatile 참조를 선언하더라도 참조 대상 객체의 일반 필드가 자동으로 volatile이 되는 것은 아닙니다.
    다만 일반 필드를 변경한 후 volatile 참조에 쓰기 작업을 수행하고, 다른 스레드에서 해당 참조를 읽는다면 happens-before 관계를 통해 일반 필드의 가시성도 보장할 수 있습니다.
    반면 이러한 동기화 없이 객체 내부 필드만 변경한다면 가시성이 보장되지 않습니다.
