- question: Redis는 RDB보다 조회 속도가 무조건 빠르다. (O/X)
  answer: X. Redis는 메모리 기반이고 단일 Key 조회에 강점이 있지만, 조회 방식과 데이터 구조에 따라 RDB가 더 적합한 경우도 있습니다.

- question: Latency가 낮으면 Throughput도 항상 높다. (O/X)
  answer: X. 낮은 Latency는 높은 Throughput에 도움이 되지만, 동시 요청 수, CPU, Network, Command 비용 등 다른 병목에 의해 Throughput이 제한될 수 있습니다.

- question: RESP가 Bulk String의 Length를 먼저 전달하는 이유는 무엇인가?
  answer: Payload의 끝을 찾기 위해 내부를 스캔할 필요 없이 정해진 Byte만 읽을 수 있어 Parsing을 단순하게 만들기 때문입니다.

- question: Non-blocking I/O를 사용하면 I/O Multiplexing은 필요하지 않다. (O/X)
  answer: X. Non-blocking I/O는 특정 Socket에서 기다리지 않게 해주지만, 여러 Socket 중 어떤 Socket이 I/O 가능한지는 별도로 찾아야 합니다. I/O Multiplexing이 이 역할을 합니다.

- question: I/O Multiplexing에서 Socket이 Ready하다는 것은 Command 실행 준비가 끝났다는 의미다. (O/X)
  answer: X. Ready는 해당 Socket에서 현재 `read()` 또는 `write()` 같은 I/O를 수행할 수 있다는 의미입니다.

- question: I/O Multiplexing은 여러 Redis Command를 동시에 실행하기 위한 기술이다. (O/X)
  answer: X. I/O Multiplexing은 많은 Connection 중 I/O가 가능한 Connection을 효율적으로 찾기 위한 기술입니다. Command 병렬 실행과는 별개의 문제입니다.

- question: 여러 Socket이 동시에 Ready 상태라면 Redis의 Command도 동시에 실행된다. (O/X)
  answer: X. 여러 Socket이 Ready 상태가 될 수 있지만, 핵심 Command 실행은 일반적으로 하나씩 순차적으로 진행됩니다.

- question: Event Loop의 역할은 무엇인가?
  answer: I/O Multiplexing을 통해 Ready Event를 확인하고, 해당 I/O와 Command 처리 등을 수행한 뒤 다시 다음 Event를 확인하는 과정을 반복합니다.

- question: Redis가 Single Thread라고 모든 Race Condition이 사라지는 것은 아니다. (O/X)
  answer: O. 하나의 Command는 중간에 다른 Command가 끼어들지 않지만, `GET → Application 연산 → SET`처럼 여러 Command로 나뉜 작업 사이에는 다른 Client의 Command가 실행될 수 있습니다.

- question: Redis Keyspace에서 일반적인 Key Lookup의 시간 복잡도는?
  answer: 평균적으로 O(1)입니다. Redis는 Keyspace를 Hash Table 기반 구조로 관리해 Key를 탐색합니다.

- question: Redis에서 TTL이 만료되면 정확히 그 순간 Key가 반드시 메모리에서 제거된다. (O/X)
  answer: X. 만료된 Key는 접근 시 제거되거나 Redis의 Active Expiration 과정에서 제거될 수 있으므로, TTL이 끝나는 순간 물리적으로 즉시 삭제된다고 볼 수는 없습니다.

- question: Redis는 일반적인 Key 조회마다 Disk에서 Value를 읽는다. (O/X)
  answer: X. 일반적인 조회는 Memory의 데이터를 대상으로 하며, Disk는 RDB나 AOF를 설정했을 때 영속성 파일 저장과 재시작 복구에 사용됩니다.
