title: Server
summary: NGINX가 React 정적 파일을 제공하고 API 요청을 Spring Application으로 전달하는 일반적인 Server 구성입니다.
nodes:
  client:
    label: Client
    row: 3
    col: 1
    description: 그냥 사용자입니다.
  nginx:
    label: NGINX
    row: 3
    col: 2
    contentRef: nginx.ko.md
  react:
    label: React
    row: 4
    col: 2
    contentRef: react.ko.md
  spring:
    label: Spring
    row: 3
    col: 3
    childSceneId: server-spring
  java-jvm:
    label: Java / JVM
    row: 5
    col: 3
    childSceneId: server-java
  cache:
    label: Cache
    row: 3
    col: 4
    contentRef: cache.ko.md
  sql:
    label: SQL
    row: 2
    col: 5
    childSceneId: server-sql
  mongodb:
    label: MongoDB
    row: 4
    col: 5
    childSceneId: server-mongodb
  redis:
    label: Redis
    row: 3
    col: 5
    childSceneId: server-redis
edges:
  - from: client
    to: nginx
    label: 요청
  - from: react
    to: nginx
    label: 정적파일 제공
    variant: supporting
  - from: nginx
    to: spring
    label: API 요청 전달
  - from: java-jvm
    fromSide: top
    to: spring
    toSide: bottom
    label: 실행 환경 제공
    variant: supporting
  - from: spring
    to: sql
    label: 관계형 데이터 요청
  - from: spring
    to: mongodb
    label: Document 데이터 요청
  - from: spring
    to: cache
    variant: supporting
    label: Cache 사용
  - from: cache
    to: redis
    variant: supporting
    label: 저장소 구현

lightFlows:
  backend-request:
    label: Backend 요청
    stages:
      - edges: [[client, nginx]]
      - edges: [[nginx, spring]]
      - edges: [[spring, cache]]
      - edges: [[cache, redis]]
      - edges: [[spring, sql], [spring, mongodb]]
  frontend-request:
    label: Frontend 요청
    stages:
      - edges: [[react, nginx]]
      - edges: [[client, nginx]]
