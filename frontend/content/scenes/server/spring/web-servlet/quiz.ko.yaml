- question: Servlet 기반 요청은 어떤 중심 흐름으로 처리되나요?
  answer: Tomcat이 요청을 받고 Servlet FilterChain을 실행한 뒤 Spring MVC의 DispatcherServlet로 전달합니다.

- question: Tomcat은 Spring 자체의 구성 요소인가요?
  answer: 아니요. Spring Boot가 기본적으로 함께 제공할 수 있는 Servlet Container이며 다른 구현으로 교체할 수 있습니다.

- question: Spring Security는 Spring MVC와 별도의 요청 흐름에서 실행되나요?
  answer: 아니요. Servlet FilterChain의 DelegatingFilterProxy를 통해 Controller 실행 전에 보안 Filter들을 실행합니다.

- question: Filter가 직접 응답을 만들면 DispatcherServlet도 실행되나요?
  answer: 아니요. Filter가 요청을 중단하면 뒤쪽 Filter와 DispatcherServlet은 호출되지 않을 수 있습니다.

- question: WebSocket으로 전환된 뒤의 Message가 매번 DispatcherServlet을 통과하나요?
  answer: 아니요. 처음 HTTP Handshake는 Filter의 영향을 받을 수 있지만 전환 뒤 Message는 매번 DispatcherServlet을 거치지 않습니다.

