- question: JdbcClient를 사용해야만 Spring JDBC로 SQL을 실행할 수 있나요?
  answer: 아니요. JdbcClient는 편리한 Fluent API를 제공하는 선택지이며, Application Code가 JdbcTemplate을 직접 사용할 수도 있습니다.

- question: JdbcTemplate은 Application Code 대신 SQL까지 결정하나요?
  answer: 아니요. 개발자가 SQL과 Parameter를 제공하고, JdbcTemplate은 JDBC 실행과 자원 관리의 반복 처리를 담당합니다.

- question: DataSource와 Connection Pool은 같은 뜻인가요?
  answer: 아니요. DataSource는 Connection을 제공하는 Interface이며, Connection Pool은 이를 구현하는 일반적인 방식 중 하나입니다.

- question: JDBC API와 JDBC Driver는 어떤 관계인가요?
  answer: JDBC API가 공통 규약을 정의하고, Database별 JDBC Driver가 그 규약에 맞는 구현과 전용 Protocol 통신을 제공합니다.

- question: JdbcTemplate은 JDBC의 SQLException을 그대로 전달하나요?
  answer: 아니요. SQLException을 Spring의 DataAccessException 계층으로 변환합니다.

- question: JdbcTemplate은 진행 중인 Spring Transaction과 별개로 항상 새 Connection을 사용하나요?
  answer: 아니요. 진행 중인 Spring Transaction이 있으면 그 Transaction에 연결된 Connection을 사용해 현재 작업에 참여합니다.
