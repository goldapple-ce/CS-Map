- question: 쿠키와 세션은 각각 무엇이고, 서버는 이를 이용해 사용자의 로그인 상태를 어떻게 유지하나요?
  answer: |
    쿠키와 세션은 Stateless한 HTTP 환경에서 사용자 상태를 유지하기 위해 사용하는 기술입니다.
    쿠키는 브라우저에 저장되는 작은 데이터로, 요청 조건에 따라 HTTP 요청에 자동으로 포함되어 서버에 전달됩니다.
    세션은 서버에서 사용자의 상태를 관리하는 방식입니다. 일반적으로 로그인에 성공하면 서버는 세션에 사용자 인증 정보를 저장하고, 세션 ID를 쿠키에 담아 클라이언트에 전달합니다.
    이후 클라이언트는 요청마다 세션 ID가 담긴 쿠키를 전달하고, 서버는 해당 세션 ID로 저장된 인증 정보를 조회하여 사용자를 확인합니다.

- question: 세션 기반 인증에서는 서버가 사용자별 세션 정보를 관리해야 합니다. 그렇다면 서버가 여러 대인 환경에서 세션 기반 인증을 사용하면 어떤 문제가 발생할 수 있고, 이를 어떻게 해결할 수 있을까요?
  answer: |
    세션 기반 인증은 서버에서 사용자의 인증 상태를 관리하기 때문에 멀티 서버 환경에서 세션 불일치 문제가 발생할 수 있습니다.
    각 서버가 세션을 개별적으로 관리한다면, 사용자가 로그인한 서버가 아닌 다른 서버로 요청을 보냈을 때 해당 세션을 찾지 못할 수 있습니다.
    이를 해결하기 위해 Redis 같은 공통 세션 저장소를 사용하면 여러 서버가 동일한 세션 정보를 조회할 수 있습니다.
    다만 공통 세션 저장소에 대한 의존성이 발생하므로, 저장소의 부하와 장애를 고려해야 합니다.
    또 다른 방법으로 Stateless JWT 기반 인증을 사용하면 각 서버에서 독립적으로 토큰을 검증할 수 있어 공통 세션 저장소에 대한 의존성을 줄일 수 있습니다.

- question: 세션 기반 인증과 JWT 기반 인증은 인증 과정에서 어떤 차이가 있고, 각각 어떤 장단점이 있을까요?
  answer: |
    세션 기반 인증은 서버에 사용자 인증 정보를 저장하고, 클라이언트가 전달한 세션 ID를 통해 해당 정보를 조회하는 방식입니다.
    반면 Stateless JWT 기반 인증은 사용자 식별 정보와 권한 등을 토큰에 담고, 서버가 서명과 만료 시간 등을 검증하여 별도의 세션 조회 없이 사용자를 인증하는 방식입니다.
    세션 기반 인증은 서버에서 인증 상태를 관리하기 때문에 로그아웃이나 세션 무효화가 간단하지만, 별도의 세션 저장소가 필요하고 이에 대한 의존성이 발생합니다.
    반면 Stateless JWT 기반 인증은 각 서버에서 독립적으로 토큰을 검증할 수 있지만, 이미 발급된 토큰을 즉시 무효화하기 어렵다는 단점이 있습니다.
    이를 완화하기 위해 Access Token의 만료 시간을 짧게 설정하고, 필요에 따라 Refresh Token이나 Blacklist 등을 활용할 수 있습니다.

- question: JWT는 어떤 구조로 이루어져 있으며, 서버는 JWT가 위변조되지 않았다는 사실을 어떻게 검증할 수 있을까요?
  answer: |
    JWT는 Header, Payload, Signature 세 부분으로 구성됩니다.
    Header에는 토큰 타입과 서명 알고리즘 등의 정보가 포함되며, Payload에는 사용자 식별 정보, 권한, 만료 시간 등의 Claim이 포함됩니다.
    Signature는 Header와 Payload를 기반으로 서명 키를 사용해 생성한 값입니다.
    서버는 전달받은 JWT의 Signature를 검증하여 토큰의 위변조 여부를 확인하고, 만료 시간 등의 Claim을 검사해 토큰의 유효성을 판단합니다.

- question: 공격자가 Payload의 사용자 ID를 변경한 뒤 다시 인코딩한다면, 서버는 어떤 원리로 변조를 감지할 수 있을까요?
  answer: |
    JWT의 Signature는 Header와 Payload를 기반으로 서명 키와 서명 알고리즘을 사용해 생성됩니다.
    공격자가 Payload의 사용자 ID를 변경하더라도 서명 키를 가지고 있지 않다면 변경된 Payload에 대한 유효한 Signature를 생성할 수 없습니다.
    따라서 서버가 JWT의 서명을 검증하면 변경된 Header와 Payload가 기존 Signature와 일치하지 않아 변조를 감지할 수 있습니다.

- question: JWT에서 대표적으로 사용하는 서명 알고리즘에는 HS256과 RS256이 있습니다. 두 알고리즘은 어떤 차이가 있으며, 토큰 발급 서버와 검증 서버가 분리된 환경에서는 어떤 방식을 사용하는 것이 유리할까요?
  answer: |
    HS256은 HMAC 기반의 대칭키 서명 알고리즘으로, 하나의 비밀키를 사용해 Signature를 생성하고 검증합니다.
    반면 RS256은 RSA 기반의 비대칭키 서명 알고리즘으로, 개인키로 Signature를 생성하고 공개키로 검증합니다.
    HS256은 연산 속도가 빠르고 구현과 키 관리가 단순하다는 장점이 있지만, 비밀키를 가진 검증 서버도 토큰을 생성할 수 있다는 특징이 있습니다.
    RS256은 서명 생성과 검증에 사용하는 키가 분리되어 있기 때문에, 여러 서버에 공개키만 제공하여 검증 권한을 분리할 수 있습니다.
    따라서 단일 서비스 환경에서는 HS256이 간단하고 효율적일 수 있으며, 인증 서버와 검증 서버가 분리된 환경에서는 RS256이 적합할 수 있습니다.

- question: JWT Filter는 어떤 역할을 하며, 클라이언트가 JWT를 전달했을 때 어떤 과정을 거쳐 사용자를 인증할까?
  answer: |
    JWT Filter는 클라이언트가 전달한 JWT를 검증하고, Spring Security에서 사용할 인증 정보를 설정하는 역할을 합니다.
    일반적으로 요청에서 JWT를 추출하고, 서명과 만료 시간 등을 검증합니다.
    유효한 토큰이라면 사용자 식별 정보와 권한 정보를 기반으로 Authentication 객체를 생성하고 SecurityContextHolder에 저장합니다.
    이후 Security Filter Chain에서 해당 인증 정보를 이용해 인가 처리를 수행할 수 있습니다.
    다만 토큰 추출 방식, 검증 실패 시 예외 처리, 사용자 정보 조회 여부 등은 구현 방식에 따라 달라질 수 있습니다.

- question: Custom JWT Filter에서 직접 401 응답을 만들지 않고, ExceptionTranslationFilter와 AuthenticationEntryPoint를 통해 인증 실패를 처리하려면 어떻게 구현해야 할까요?
  answer: |
    Custom JWT Filter에서 JWT 검증에 실패하면 SecurityContextHolder에 Authentication을 설정하지 않고 다음 Filter로 요청을 전달할 수 있습니다.
    이후 AnonymousAuthenticationFilter는 인증 정보가 없는 경우 AnonymousAuthenticationToken을 설정합니다.
    AuthorizationFilter는 인증이 필요한 리소스에 대한 접근을 거부하고, ExceptionTranslationFilter는 익명 사용자의 접근 거부를 확인하여 AuthenticationEntryPoint를 호출합니다.
    이러한 방식으로 JWT Filter에서 직접 응답을 생성하지 않고 Spring Security의 인증 실패 처리 흐름을 활용할 수 있습니다.
    다만 이 방식은 인증이 필요한 API에서 적용되며, 공개 API에서는 요청이 허용될 수 있습니다.

- question: JWT Filter는 AuthorizationFilter보다 앞에 배치해야 할까요, 뒤에 배치해야 할까요? 그리고 그 이유는 무엇일까요?
  answer: |
    JWT Filter는 AuthorizationFilter보다 앞에 배치해야 합니다.
    JWT Filter는 클라이언트가 전달한 JWT를 검증하고, Authentication을 생성하여 SecurityContextHolder에 저장하는 역할을 합니다.
    AuthorizationFilter는 SecurityContextHolder에 저장된 Authentication을 이용해 접근 권한을 판단하기 때문에, JWT Filter가 먼저 실행되어야 합니다.
    만약 AuthorizationFilter가 먼저 실행된다면 인증 정보가 설정되지 않은 상태에서 권한을 검사하게 되어, 실제로 유효한 JWT를 가지고 있더라도 접근이 거부될 수 있습니다.

- question: Refresh Token을 서버에서 Redis에 저장하고 관리한다고 가정해 봅시다. JWT 자체에 서명과 만료 시간이 존재하는데, Refresh Token을 Redis에 별도로 저장하는 이유는 무엇일까요?
  answer: |
    Refresh Token을 Redis에 저장하는 이유는 서버에서 토큰의 유효 상태를 관리하기 위해서입니다.
    JWT는 서명과 만료 시간이 유효하면 계속 사용할 수 있기 때문에, 로그아웃하거나 토큰 탈취가 의심되어도 발급된 토큰을 즉시 무효화하기 어렵습니다.
    따라서 Redis에 Refresh Token의 유효 상태를 저장하고, Access Token 재발급 시 이를 조회하도록 구현할 수 있습니다.
    이를 통해 로그아웃 시 토큰을 무효화하거나, Refresh Token Rotation을 적용할 수 있습니다.

- question: JWT Filter가 모든 API 요청에서 Access Token을 검증하도록 구현되어 있다고 가정해 봅시다. 그런데 Access Token이 만료되어 클라이언트가 Refresh Token으로 재발급 API를 호출했습니다. 이때도 JWT Filter가 만료된 Access Token을 검사하여 요청을 거부한다면 재발급 자체가 불가능해질 수 있습니다. 이 문제를 해결하려면 JWT Filter를 어떻게 설계해야 할까요?
  answer: |
    Refresh Token 재발급 API는 Access Token이 만료된 상태에서도 접근할 수 있어야 하므로, Access Token 인증을 요구하지 않도록 구성해야 합니다.
    단순히 permitAll()을 설정하는 것만으로는 JWT Filter가 생략되지 않기 때문에, shouldNotFilter() 등을 이용해 재발급 API를 JWT Filter의 검사 대상에서 제외할 수 있습니다.
    이후 재발급 API에서 Refresh Token의 유효성을 별도로 검증하고 새로운 Access Token을 발급하도록 구현할 수 있습니다.

- question: Refresh Token을 Redis에 저장하고 관리한다면 Rotation도 구현할 수 있습니다. Refresh Token Rotation은 어떤 방식으로 동작하며, 기존 Refresh Token을 계속 재사용하는 것보다 어떤 장점이 있을까요?
  answer: |
    Refresh Token Rotation은 Access Token을 재발급할 때 Refresh Token도 함께 재발급하고, 기존 Refresh Token을 무효화하는 방식입니다.
    서버는 Refresh Token 간의 관계를 Token Family로 관리하고, 이미 무효화된 Refresh Token이 다시 사용되면 Replay Attack 가능성을 감지할 수 있습니다.
    이 경우 현재 유효한 Refresh Token까지 무효화하여 추가적인 토큰 재발급을 차단할 수 있습니다.
    따라서 Refresh Token Rotation은 탈취된 토큰의 재사용을 감지하고 피해를 제한하는 데 도움이 됩니다.

- question: 사용자가 하나의 Refresh Token으로 거의 동시에 두 개의 Access Token 재발급 요청을 보냈다고 가정하겠습니다. 두 요청이 모두 기존 Refresh Token의 유효성을 확인한 뒤 새로운 Refresh Token을 발급하려고 합니다. 이때 어떤 문제가 발생할 수 있으며, Redis를 사용한다면 어떻게 해결할 수 있을까요?
  answer: |
    Refresh Token Rotation 과정에서 동시에 여러 재발급 요청이 발생하면 Race Condition이 발생할 수 있습니다.
    두 요청이 기존 Refresh Token을 동시에 유효하다고 판단하면 각각 새로운 Refresh Token을 발급할 수 있으며, 저장 방식에 따라 토큰이 덮어써지는 문제가 발생할 수 있습니다.
    Redis는 개별 명령의 원자성을 보장하지만 여러 명령에 걸친 작업의 원자성은 자동으로 보장하지 않습니다.
    따라서 Lua Script 등을 이용해 기존 Refresh Token의 유효성 확인과 새로운 토큰으로의 교체를 원자적으로 처리하면, 하나의 요청만 재발급에 성공하도록 보장할 수 있습니다.

- question: JWT를 Cookie에 저장하는 방식과 Authorization 헤더에 담아 전달하는 방식은 어떤 차이가 있으며, 각각 어떤 보안 문제를 고려해야 할까요?
  answer: |
    Cookie 방식은 브라우저가 요청 조건에 따라 쿠키를 자동으로 전송하기 때문에 편리하지만, CSRF 공격에 노출될 수 있습니다. 이를 완화하기 위해 SameSite와 CSRF Token 등을 사용할 수 있습니다.
    반면 Authorization 헤더 방식은 클라이언트가 JWT를 직접 헤더에 추가하기 때문에 브라우저의 자동 쿠키 전송으로 인한 CSRF 위험이 낮습니다.
    다만 JWT를 localStorage처럼 JavaScript에서 접근할 수 있는 저장소에 보관한다면 XSS 공격으로 토큰이 탈취될 수 있습니다.

- question: JWT를 HttpOnly Cookie에 저장하면 JavaScript에서는 해당 쿠키에 접근할 수 없습니다. 그렇다면 클라이언트는 JWT를 어떻게 서버에 전달할 수 있으며, 서버의 Custom JWT Filter에서는 어떤 방식으로 JWT를 추출할 수 있을까요?
  answer: |
    HttpOnly Cookie는 JavaScript에서 접근할 수 없지만, 브라우저는 요청 조건에 따라 해당 쿠키를 서버에 자동으로 전송할 수 있습니다.
    따라서 클라이언트에서 JWT를 직접 추출하거나 Authorization 헤더에 설정할 필요가 없습니다.
    서버에서는 Custom JWT Filter가 HttpServletRequest의 getCookies()를 통해 쿠키 목록을 조회하고, JWT가 저장된 쿠키의 값을 추출할 수 있습니다.

- question: 세션 기반 인증에서는 여러 요청이 동일한 SecurityContext 객체를 참조할 수 있습니다. 반면 Stateless JWT 기반 인증에서는 요청마다 새로운 SecurityContext를 생성할 수 있습니다. 이 두 방식에서 SecurityContext의 공유로 인한 Race Condition 발생 가능성은 어떻게 달라질까요?
  answer: |
    세션 기반 인증에서는 동일한 세션에서 발생한 여러 요청이 같은 SecurityContext 객체를 공유할 수 있습니다.
    이때 서로 다른 스레드가 동일한 SecurityContext의 Authentication을 변경하면 Race Condition이 발생할 수 있습니다.
    반면 Stateless JWT 기반 인증에서는 일반적으로 요청마다 새로운 SecurityContext를 생성하여 Authentication을 설정합니다.
    따라서 각 요청이 독립적인 SecurityContext를 사용하므로, 공유된 SecurityContext를 변경하면서 발생하는 Race Condition을 방지할 수 있습니다.
