- question: FilterChainProxy와 SecurityFilterChain의 역할은 각각 무엇인가요?
  answer: SecurityFilterChain은 요청에 적용할 조건과 Security Filter 목록을 보관합니다. FilterChainProxy는 그 안의 Filter들을 순서대로 실행합니다.
- question: SecurityContextHolderFilter가 요청을 처리할 때 수행하는 역할을 설명하세요.
  answer: 기존 SecurityContext를 불러와 현재 요청의 SecurityContextHolder에 설정합니다. 세션 기반 인증에서는 SecurityContext가 주로 HTTP 세션에 저장됩니다.
- question: 인증되지 않은 사용자가 인증이 필요한 리소스에 접근했을 때의 처리 과정을 설명하세요.
  answer: AuthorizationFilter가 인가 판단을 수행하고 인가Exception을 발생시킵니다. ExceptionTranslationFilter가 뒤쪽에서 발생한 보안 예외를 처리합니다.
- question: Oauth2AuthorizationRequestRedirectFilter와 Oauth2LoginAuthenticationFilter의 차이점은 무엇인가요?
  answer: Oauth2LoginAuthenticationFilter는 OAuth2 로그인을 시작하는 요청을 처리하고, Oauth2AuthorizationRequestRedirectFilter는 인증을 처리합니다.
- question: SecurityFilterChain에서 발생한 모든 Exception은 ExceptionTranslationFilter한다. (O/X)
  answer: X. ExceptionTranslationFilter는 자신 뒤에있는 보안 Exception에 대해서만 처리합니다.
