- question: OAuth 2.0은 무엇이며, 어떤 문제를 해결하기 위해 등장한 프로토콜인가요?
  answer: |
    OAuth 2.0은 사용자가 자신의 비밀번호를 제3자 애플리케이션에 직접 제공하지 않고도, 특정 리소스에 대한 접근 권한을 위임할 수 있도록 하는 인가 프로토콜입니다.
    기존에는 외부 애플리케이션이 사용자의 리소스에 접근하려면 계정 정보를 직접 전달해야 하는 문제가 있었습니다.
    OAuth 2.0은 이를 해결하기 위해 사용자가 동의한 범위의 접근 권한을 Access Token으로 위임하여, 제3자 애플리케이션이 비밀번호 없이도 보호된 리소스에 접근할 수 있도록 합니다.

- question: OAuth 2.0에는 Resource Owner, Client, Authorization Server, Resource Server라는 네 가지 역할이 존재합니다. 각각 어떤 역할을 수행하며, 서로 어떤 관계를 가지고 있나요?
  answer: |
    Resource Owner는 보호된 리소스의 소유자이며, Client는 해당 리소스에 접근하려는 애플리케이션입니다.
    Authorization Server는 사용자 인증과 권한 위임을 처리하고 Authorization Code와 Access Token을 발급하며, Resource Server는 실제 보호된 리소스를 관리하는 서버입니다.
    Authorization Code Grant에서는 Client가 사용자를 Authorization Server로 이동시키고, 사용자가 인증 및 권한 위임에 동의하면 Authorization Server가 Authorization Code를 Client에 전달합니다.
    Client는 Authorization Code를 Authorization Server에 전달하여 Access Token을 발급받고, 이를 Resource Server에 전달하여 보호된 리소스에 접근합니다.

- question: OAuth 2.0에서는 Authorization Server와 Resource Server를 서로 다른 역할로 구분합니다. 두 서버는 반드시 물리적으로 분리되어 있어야 할까요? 그리고 역할을 구분하는 이유는 무엇인가요?
  answer: |
    Authorization Server와 Resource Server는 반드시 물리적으로 분리되어 있을 필요는 없습니다.
    OAuth 2.0에서는 각 서버가 담당하는 역할을 논리적으로 구분합니다.
    Authorization Server는 사용자의 권한 위임을 처리하고 Access Token을 발급하는 역할을 수행하며, Resource Server는 발급된 Access Token을 검증하여 보호된 리소스에 대한 접근을 제어합니다.
    두 서버를 분리하면 각 역할을 독립적으로 관리하고 확장할 수 있으며, 인증 및 권한 위임 기능과 실제 리소스 제공 기능의 책임을 명확히 구분할 수 있습니다.

- question: Spring Security에서 OAuth 로그인이 완료되면 Authorization Server로부터 Access Token을 발급받습니다. Spring Security는 발급받은 Access Token을 어디에 보관하며, 이후 Resource Server에 접근해야 할 때 어떻게 사용할 수 있을까요?
  answer: |
    Spring Security는 OAuth 로그인에 성공하면 Authorization Server로부터 발급받은 Access Token과 Refresh Token을 OAuth2AuthorizedClient 객체에 저장합니다.
    이후 OAuth2LoginAuthenticationFilter는 OAuth2AuthorizedClientRepository를 통해 해당 객체를 저장하며, 기본 구성에서는 인증된 사용자의 정보를 OAuth2AuthorizedClientService에 위임하여 관리합니다.
    기본 구현체인 InMemoryOAuth2AuthorizedClientService는 이를 서버 메모리에 저장하며, 필요에 따라 DB 기반 저장소로 교체할 수 있습니다.
    이후 Resource Server에 접근해야 한다면 OAuth2AuthorizedClientManager를 통해 기존 OAuth2AuthorizedClient를 조회하고, 해당 Access Token을 Authorization 헤더에 담아 API를 호출할 수 있습니다.
    Access Token이 만료된 경우에는 유효한 Refresh Token이 있고 재발급 기능이 구성되어 있다면 새로운 Access Token을 발급받아 사용할 수 있습니다.

- question: OAuth 2.0의 Authorization Code Grant에서는 Authorization Server가 Access Token을 Client에게 바로 전달하지 않고, 먼저 Authorization Code를 발급합니다. Access Token을 바로 전달하지 않고 Authorization Code를 거쳐 발급하는 이유는 무엇인가요?
  answer: |
    OAuth 2.0에서 Authorization Code를 사용하는 이유는 Access Token이 브라우저의 리다이렉트 과정에서 직접 노출되는 것을 방지하기 위해서입니다.
    Authorization Server는 사용자 인증과 권한 위임이 완료되면 Access Token 대신 짧은 유효기간을 가진 Authorization Code를 발급합니다.
    Client는 전달받은 Authorization Code를 Authorization Server의 Token Endpoint에 전달하여 Access Token으로 교환합니다.
    이렇게 토큰 발급 과정을 분리하면 Access Token이 리다이렉트 응답에 직접 노출되는 위험을 줄일 수 있으며, PKCE나 Client 인증을 통해 코드 탈취에 대한 보안도 강화할 수 있습니다.

- question: OAuth 2.0에서는 Client가 사용자 리소스에 접근할 권한을 요청할 때 Scope를 사용합니다. Scope는 무엇이며, OAuth 2.0에서 Scope를 사용하는 이유는 무엇인가요?
  answer: |
    Scope는 OAuth 2.0에서 Client가 접근할 수 있는 리소스와 작업의 범위를 나타내는 권한 단위입니다.
    Client는 Authorization Server에 필요한 Scope를 요청하고, Resource Owner의 동의와 Authorization Server의 정책에 따라 허용된 권한을 부여받습니다.
    이후 Resource Server는 Access Token에 부여된 Scope를 확인하여 요청한 리소스에 접근할 수 있는지 판단합니다.
    이를 통해 Client에 필요한 최소한의 권한만 부여하여 과도한 리소스 접근을 제한할 수 있습니다.

- question: Authorization Code Grant에서 Client는 Authorization Code를 발급받은 뒤 Authorization Server에 Access Token을 요청합니다. 이때 Authorization Server는 요청을 보낸 Client가 정상적인 Client인지 어떻게 확인할 수 있을까요?
  answer: |
    OAuth 2.0에서 Authorization Server는 등록된 Client 정보를 기반으로 요청을 검증합니다.
    Client는 Authorization Code를 Access Token으로 교환할 때 자신의 Client ID를 사용하며, 서버 기반의 Confidential Client라면 Client Secret 등을 이용해 자신을 인증할 수 있습니다.
    Authorization Server는 Client 인증과 함께 Authorization Code가 유효한지, 해당 Client에게 발급된 Code인지, Redirect URI가 일치하는지 검증합니다.

- question: OAuth 2.0에서 Client ID와 Client Secret은 각각 어떤 역할을 수행하나요? 그리고 Client Secret을 SPA나 모바일 앱에 안전하게 저장하기 어려운 이유는 무엇인가요?
  answer: |
    Client ID는 Authorization Server에 등록된 Client를 식별하기 위한 공개 식별자이며, Client Secret은 Client의 신원을 인증하기 위해 사용하는 비밀값입니다.
    서버 기반 Client는 Client Secret을 서버 내부에 안전하게 보관할 수 있지만, SPA나 모바일 앱은 사용자의 기기에서 실행되므로 비밀값을 안전하게 보관하기 어렵습니다.
    따라서 이러한 애플리케이션은 일반적으로 Public Client로 분류되며, Client Secret 대신 Authorization Code와 PKCE를 이용하여 토큰 발급 과정의 보안을 강화할 수 있습니다.

- question: 서버 기반 Client가 Authorization Code를 발급받아 Access Token으로 교환하는 과정에서 Authorization Server는 어떤 항목들을 검증하며, 각각 무엇을 확인하기 위한 것인가요?
  answer: |
    Authorization Server는 Access Token 발급 요청을 받으면 먼저 Client ID와 Client Secret 등을 이용해 정상적인 Client인지 인증합니다.
    이후 Authorization Code가 유효한지, 만료되거나 이미 사용된 Code는 아닌지, 해당 Client에게 발급된 Code인지 검증합니다.
    또한 Redirect URI가 최초 인가 요청과 일치하는지 확인합니다.
    모든 검증에 성공하면 Authorization Code에 연결된 Resource Owner의 권한 위임 정보를 바탕으로 Access Token을 발급합니다.

- question: Authorization Code Grant에서는 최초 인가 요청을 보낼 때 state라는 파라미터를 사용할 수 있습니다. State는 어떤 역할을 하며, OAuth 2.0 로그인 과정에서 어떤 보안 문제를 방지하기 위해 사용하나요?
  answer: |
    핵심은 OAuth 로그인 과정에서 발생하는 CSRF 공격을 방지하기 위해서입니다.
    예를 들어 공격자가 자신의 계정으로 발급받은 Authorization Code를 피해자의 브라우저에 전달하여 로그인을 유도할 수 있습니다.
    Client가 Authorization Code만 검증한다면 피해자가 공격자의 계정으로 로그인되는 문제가 발생할 수 있습니다.
    하지만 state를 검증하면 현재 브라우저에서 시작한 인증 요청과 일치하지 않는 응답을 거부할 수 있습니다.
    즉, state는 Authorization Code가 유효한지가 아니라 현재 사용자가 시작한 인증 요청에 대한 응답인지를 확인하는 역할입니다.

- question: 서버 기반 Client가 Authorization Code를 이용해 Access Token을 발급받았습니다. 이후 해당 Access Token을 이용해 사용자 정보를 조회하고, 자사 서비스의 로그인까지 완료하려면 어떤 과정을 거쳐야 하나요?
  answer: |
    Client는 Authorization Server로부터 발급받은 Access Token을 이용해 Resource Server에 사용자 정보를 요청합니다.
    Resource Server로부터 사용자 정보를 전달받으면 OAuth 제공자와 사용자 고유 식별자를 기준으로 자사 DB에 등록된 사용자인지 확인합니다.
    기존 사용자라면 해당 계정으로 로그인하고, 신규 사용자라면 회원가입 또는 계정 생성 절차를 진행할 수 있습니다.
    이후 자사 서비스의 인증 정보를 생성하고 세션이나 JWT 등을 발급하여 로그인 상태를 유지합니다.

- question: Client가 이미 Access Token 발급에 사용한 Authorization Code를 다시 Authorization Server에 전달하면 어떻게 처리해야 하며, 재사용을 허용하지 않는 이유는 무엇인가요?
  answer: |
    Authorization Code는 일회성으로 사용되며, 이미 사용한 Code를 다시 전달하면 Authorization Server는 토큰 발급을 거부합니다.
    만약 재사용을 허용한다면 동일한 Authorization Code를 이용해 여러 Access Token을 발급받을 수 있으며, Code가 탈취되었을 때 공격자가 이를 악용할 가능성이 있습니다.
    따라서 Authorization Server는 Code가 한 번 사용되면 무효화하고, 재사용이 감지되면 기존에 발급한 토큰의 무효화도 고려해야 합니다.

- question: Google로부터 Access Token을 발급받고 사용자 정보를 조회하여 자사 서비스의 회원임을 확인했습니다. 이때 Google이 발급한 Access Token을 자사 API 인증에도 그대로 사용해도 될까요? 자사 서비스에서 별도로 JWT를 발급하는 이유는 무엇일까요?
  answer: |
    Google에서 발급한 Access Token은 Google의 Resource Server에 접근하기 위한 토큰이므로, 자사 API 인증에 그대로 사용하는 것은 적절하지 않습니다.
    자사 서비스는 OAuth 로그인을 통해 사용자 정보를 조회하고 회원을 식별한 뒤, 자체적인 인증 체계를 구성할 수 있습니다.
    이때 별도의 JWT를 발급하면 자사 서비스의 사용자 식별 정보와 권한, 만료 시간 등을 직접 관리할 수 있습니다.
    또한 Google의 토큰 만료 정책에 의존하지 않고 자사 서비스의 인증 정책을 적용할 수 있다는 장점이 있습니다.
    다만 자체 JWT 발급이 필수는 아니며, 서버 세션을 이용해 로그인 상태를 유지하는 것도 가능합니다.

- question: 공격자가 Redirect URI를 자신의 서버 주소로 변경할 수 있다면 어떤 보안 문제가 발생할까요? 그리고 Authorization Server가 Redirect URI를 엄격하게 검증해야 하는 이유는 무엇인가요?
  answer: |
    공격자가 Redirect URI를 자신의 서버 주소로 변경할 수 있다면, Authorization Server가 발급한 Authorization Code가 공격자의 서버로 전달될 수 있습니다.
    공격자가 해당 Code를 Access Token으로 교환할 수 있다면 사용자의 리소스에 무단으로 접근할 위험이 있습니다.
    따라서 Authorization Server는 사전에 등록된 Redirect URI와 요청에 포함된 Redirect URI를 정확하게 비교하여 허용되지 않은 주소로 인증 결과가 전달되는 것을 방지해야 합니다.

- question: Google과 GitHub 로그인을 모두 지원하는 서비스를 개발했다고 가정하겠습니다. 두 OAuth 제공자에서 동일한 이메일 주소를 가진 사용자 정보가 반환되었습니다. 이메일 주소가 같다는 이유만으로 두 사용자를 자사 서비스의 동일한 계정으로 처리해도 될까요? 사용자 계정을 어떤 기준으로 식별하고 연결하는 것이 안전할까요?
  answer: |
    Google과 GitHub에서 동일한 이메일 주소가 반환되더라도 반드시 동일한 사용자라고 판단할 수는 없습니다.
    이메일은 변경되거나 재사용될 수 있으므로, OAuth 제공자와 해당 제공자가 발급한 사용자 고유 식별자를 조합하여 회원을 식별하는 것이 안전합니다.
    서로 다른 OAuth 계정을 하나의 자사 계정으로 통합하려면 단순히 이메일이 일치한다는 이유로 자동 연결하지 않고, 사용자가 두 계정의 소유권을 증명하는 별도의 계정 연결 절차를 거치는 것이 적절합니다.

- question: 공격자가 Google에서 시작한 인증 요청에 GitHub의 인증 응답을 끼워 넣을 수 있다면 어떤 문제가 발생할 수 있으며, Client는 이를 어떻게 방지할 수 있을까요?
  answer: |
    Mix-Up Attack은 여러 Authorization Server를 지원하는 Client가 Authorization Code의 발급자를 혼동하도록 유도하는 공격입니다.
    공격자는 Client가 정상적인 Authorization Server에서 발급받은 Code를 공격자의 Token Endpoint로 전달하도록 유도하여 Authorization Code를 탈취할 수 있습니다.
    이를 방지하기 위해 Client는 최초 요청한 Authorization Server의 식별자를 저장하고, 응답에 포함된 iss와 비교하여 실제 발급자가 일치하는지 검증해야 합니다.

- question: Authorization Code Grant에서 Client가 Authorization Code를 Access Token으로 교환할 때, Authorization Server는 최초 인가 요청에 사용된 Redirect URI도 검증합니다. 이미 Client ID와 Client Secret으로 정상적인 Client임을 확인했는데도, Redirect URI를 추가로 검증하는 이유는 무엇인가요?
  answer: |
    Client ID와 Client Secret은 Access Token을 요청한 Client의 신원을 검증하기 위한 정보입니다.
    반면 Redirect URI는 Authorization Code가 최초 인가 요청에서 지정한 주소와 연결되어 있는지 확인하기 위한 정보입니다.
    Authorization Server는 Client 인증에 성공하더라도 Authorization Code에 연결된 Redirect URI와 토큰 요청의 Redirect URI가 일치하는지 검증합니다.
    이를 통해 Authorization Code가 다른 Redirect URI를 사용하는 인증 흐름에서 부정하게 교환되는 것을 방지할 수 있습니다.

- question: 사용자가 이미 Google에 로그인되어 있고, 자사 서비스에도 프로필 조회 권한을 부여한 상태라고 가정하겠습니다. 이 사용자가 다시 OAuth Authorization Code Grant를 시작하면 반드시 Google 로그인 화면과 권한 동의 화면이 나타날까요? 나타나지 않을 수도 있다면 그 이유는 무엇인가요?
  answer: |
    사용자가 이미 Google에 로그인되어 있다면 반드시 로그인 화면이 나타나는 것은 아닙니다.
    Authorization Server는 브라우저에서 전달한 세션 쿠키를 통해 기존 인증 상태를 확인할 수 있으며, 세션이 유효하다면 로그인 과정을 생략할 수 있습니다.
    또한 사용자가 이전에 해당 Client에 필요한 Scope를 허용했다면 권한 동의 화면도 생략될 수 있습니다.
    따라서 기존 인증 상태와 권한 동의가 유효하다면 별도의 사용자 입력 없이 Authorization Code를 발급받을 수 있습니다.

- question: 사용자가 브라우저에서 Google 계정 A와 계정 B에 모두 로그인한 상태라고 가정하겠습니다. 그런데 자사 서비스에서 Google 로그인을 요청했을 때, 사용자가 원하지 않는 계정 A로 자동 로그인되었습니다. 이때 Client는 사용자가 Google 계정을 직접 선택하도록 어떻게 요청할 수 있을까요?
  answer: |
    OAuth 로그인에서는 Authorization Server에 기존 로그인 세션이 존재한다면 로그인 화면이 생략되거나 특정 계정으로 인증이 진행될 수 있습니다.
    Google에서는 AuthorizationRequest에 prompt=select_account를 추가하여 기존 세션이 존재하더라도 사용자에게 계정 선택 화면을 표시하도록 요청할 수 있습니다.
    Spring Security에서는 DefaultOAuth2AuthorizationRequestResolver를 커스터마이징하여 해당 파라미터를 추가할 수 있습니다.

- question: Authorization Code가 이미 전달되었는데도 기존 AuthorizationRequest를 조회해야 하는 이유는 무엇이며, 조회한 정보는 이후 인증 과정에서 어떻게 활용되나요?
  answer: |
    OAuth2LoginAuthenticationFilter가 AuthorizationRequestRepository를 조회하는 이유는 최초 Authorization 요청과 현재 Authorization Response를 연결하기 위해서입니다.
    AuthorizationRequest에는 State, Redirect URI, Registration ID 등 최초 요청에 사용된 정보가 포함되어 있습니다.
    Spring Security는 이 정보를 이용해 State를 검증하고 ClientRegistration을 식별하며, Authorization Code를 Access Token으로 교환하는 데 필요한 정보를 전달합니다.
