    row: 2
    col: 2
    rowSpan: 1
    colSpan: 3
lightFlows:
  login:
    label: 로그인
    stages:
      - edges:
          [
            [
              security-context-holder-filter,
              abstract-authentication-processing-filter,
            ],
          ]
      - edges:
          - [abstract-authentication-processing-filter, security-context-holder]
          - [
              abstract-authentication-processing-filter,
              security-context-repository,
            ]
  authenticated:
    label: 인증 성공
    stages:
      - edges: [[security-context-holder-filter, security-context-repository]]
      - edges: [[security-context-holder-filter, security-context-holder]]
      - edges:
          [
            [
              security-context-holder-filter,
              abstract-authentication-processing-filter,
            ],
          ]
      - edges:
          [
            [
              abstract-authentication-processing-filter,
              anonymous-authentication-filter,
            ],
          ]
      - edges:
          - [anonymous-authentication-filter, exception-translation-filter]
          - [security-context-holder, exception-translation-filter]

      - edges:
          - [exception-translation-filter, authorization-filter]
          - [security-context-holder, authorization-filter]
  un-authenticated:
    label: 인증 실패
    stages:
      - edges:
          [
            [
              security-context-holder-filter,
              abstract-authentication-processing-filter,
            ],
          ]
      - edges:
          [
            [
              abstract-authentication-processing-filter,
              anonymous-authentication-filter,
            ],
          ]

      - edges: [[anonymous-authentication-filter, security-context-holder]]
      - edges:
          - [anonymous-authentication-filter, exception-translation-filter]
          - [security-context-holder, exception-translation-filter]

      - edges:
          - [exception-translation-filter, authorization-filter]
          - [security-context-holder, authorization-filter]
