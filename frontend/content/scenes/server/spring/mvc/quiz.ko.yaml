- question: DispatcherServlet이 Controller 조회와 실행을 모두 직접 수행하나요?
  answer: 아니요. 전체 순서를 조정하면서 Controller 조회는 HandlerMapping에, 실행은 HandlerAdapter에 맡깁니다.

- question: HandlerMapping은 무엇을 찾아 반환하나요?
  answer: 현재 요청을 처리할 Controller와 적용할 HandlerInterceptor를 HandlerExecutionChain으로 묶어 반환합니다.

- question: HandlerInterceptor가 Controller를 직접 호출하나요?
  answer: 아니요. DispatcherServlet이 Interceptor Lifecycle을 실행하고 HandlerAdapter를 통해 Controller를 호출합니다.

- question: ViewResolver는 어떤 역할을 하나요?
  answer: Controller가 반환한 논리적인 View 이름을 실제 View로 찾습니다.

- question: REST 응답도 항상 ViewResolver를 거치나요?
  answer: 아니요. `@ResponseBody`와 `@RestController` 응답은 일반적으로 HttpMessageConverter가 Response Body를 작성합니다.

