- question: Java에서 만든 객체는 모두 Spring Bean인가요?
  answer: 아니요. Component scan이나 `@Bean` 설정 등을 통해 Spring Container에 등록되어 관리되는 객체가 Bean입니다.

- question: Spring에서 IoC는 무엇을 뜻하나요?
  answer: 객체의 생성, 연결과 생명주기를 제어하는 주체가 개발자 코드에서 Spring Container로 바뀌는 것을 뜻합니다.

- question: DI를 사용하면 객체가 필요한 의존성을 직접 생성하나요?
  answer: 아니요. 객체는 생성자 등을 통해 Spring Container가 찾아 준 의존성을 전달받습니다.

- question: Spring AOP는 공통 기능을 일반적으로 어떻게 적용하나요?
  answer: 대상 Bean을 Proxy로 감싸 로깅이나 transaction 같은 공통 기능을 method 호출 전후에 적용합니다.

- question: Spring Framework와 Spring Boot는 같은 것인가요?
  answer: 아니요. Spring Framework는 Container와 AOP 같은 기반 기능을 제공하고, Spring Boot는 이를 빠르게 조합하도록 자동 설정과 starter 등을 제공합니다.
