- question: Spring Framework의 Core에서 Container와 Bean은 어떤 관계인가요?
  answer: Container가 Bean을 만들고 의존 관계와 생명주기를 관리합니다.

- question: Spring AOP는 모든 Bean이 반드시 거쳐야 하는 실행 단계인가요?
  answer: 아니요. 필요한 Bean에 Proxy를 통해 공통 기능을 적용하는 보조 기능입니다.

- question: Spring Transaction이 서로 다른 Data Access 기술에서 제공하는 공통점은 무엇인가요?
  answer: 작업의 commit과 rollback 경계를 일관된 방식으로 정하도록 돕는 Transaction 추상화입니다.

- question: Spring JDBC는 Java JDBC API를 대체하는 별도 통신 표준인가요?
  answer: 아니요. JDBC와 DataSource를 사용하면서 반복 처리, 예외 변환과 Spring Transaction 연동을 제공하는 Spring Framework 지원입니다.

- question: Spring Data는 Spring Framework Scene의 Data Access Area와 같은 뜻인가요?
  answer: 아니요. Spring Data는 Repository와 저장소별 Mapping을 제공하는 별도 Spring 프로젝트입니다.

- question: Web Servlet, Data Access와 목적별 Spring 프로젝트는 항상 차례로 실행되나요?
  answer: 아니요. Application의 필요에 따라 선택하고 Bean과 결합하는 서로 다른 기능 영역입니다.
