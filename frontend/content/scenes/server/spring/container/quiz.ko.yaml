- question: Spring Container는 설정 정보를 읽은 뒤 무엇을 먼저 등록하나요?
  answer: 관리할 객체의 생성 방법과 의존성을 BeanDefinition으로 등록합니다.

- question: ApplicationContext는 Spring Container에서 어떤 역할을 하나요?
  answer: BeanFactory 기능을 포함하며 Application에서 주로 사용하는 Container Interface입니다.

- question: Bean Instance를 만든 뒤 바로 사용 가능한 상태가 되나요?
  answer: 아니요. 의존성 주입과 필요한 후처리 및 초기화 Callback을 거친 뒤 사용할 수 있습니다.

- question: Spring Container를 사용하면 객체가 필요한 의존성을 직접 생성해야 하나요?
  answer: 아니요. 외부 Container가 생성자나 Factory Method 등의 계약을 통해 의존성을 주입합니다.

- question: Container 시작 오류를 확인할 때 가장 바깥쪽 Exception만 보면 되나요?
  answer: 아니요. 어떤 Bean을 만들던 중 어느 의존성에서 실패했는지 원인 Chain을 따라가야 합니다.

