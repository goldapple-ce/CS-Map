- question: JPA는 Database와 직접 통신하는 완성된 제품인가요?
  answer: 아니요. JPA는 API와 동작 규칙을 정의하는 표준이며 Hibernate 같은 Provider가 이를 구현합니다.

- question: Entity의 동일성과 상태를 기억하는 공간은 무엇인가요?
  answer: Persistence Context입니다.

- question: Transaction 안에서 관리 중인 Entity가 변경되면 어떤 과정이 이를 확인하나요?
  answer: JPA Provider의 Dirty Checking이 변경을 감지하고 Flush 시점에 필요한 SQL을 준비합니다.

- question: Flush는 Transaction을 최종 확정하는 Commit과 같은가요?
  answer: 아니요. Flush는 SQL을 Database에 반영하는 시점이며 Commit은 Transaction을 최종 확정합니다.

- question: JPQL은 Table과 Column을 직접 대상으로 작성하나요?
  answer: 아니요. Entity와 Attribute를 대상으로 Query를 작성합니다.

- question: JpaRepository를 사용하면 Persistence Context와 Flush 규칙을 몰라도 되나요?
  answer: 아니요. Spring Data JPA Repository도 내부에서 EntityManager를 사용하므로 JPA의 Entity 상태 규칙이 그대로 적용됩니다.

