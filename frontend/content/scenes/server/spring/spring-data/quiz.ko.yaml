- question: Spring Data Repository Interface 자체가 실제 저장 방식을 모두 구현하나요?
  answer: 아니요. 선택한 Spring Data Module이 Repository 구현 객체를 만들고 저장소별 Mapping과 통신 방식을 적용합니다.

- question: Spring Data JPA, JPA와 Hibernate는 어떤 순서로 연결되나요?
  answer: Spring Data JPA가 JPA 표준을 사용하고 Hibernate 같은 Provider가 그 표준을 구현합니다.

- question: Spring Data JDBC와 Spring JDBC는 같은 기술인가요?
  answer: 아니요. Spring JDBC는 SQL 실행의 반복 처리를 줄이고, Spring Data JDBC는 그 기반 위에 Repository와 Aggregate Mapping을 제공합니다.

- question: NoSQL Repository는 JDBC를 통해 저장소와 통신하나요?
  answer: 아니요. 저장소별 Driver와 Network Protocol을 사용합니다.

- question: Transaction과 DataSource는 Spring Data 자체의 공통 구성 요소인가요?
  answer: 아니요. Spring Data Module이 필요에 따라 사용하는 Spring Framework와 JDBC 기반 기능입니다.
