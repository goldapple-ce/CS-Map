- question: Query Optimizer는 어떤 실행 방법을 선택하나요?
  answer: 가능한 실행 방법의 비용을 비교해 비용이 낮을 것으로 예상되는 Query Execution Plan을 선택합니다.

- question: Index가 있으면 Query Optimizer가 항상 Index Scan을 선택하나요?
  answer: 아니요. 많은 Row를 읽거나 Index 사용 비용이 더 크다고 판단하면 Table Scan을 선택할 수 있습니다.

- question: Buffer Pool은 SQL 결과를 저장하는 Cache인가요?
  answer: 아니요. Table과 Index의 Page를 Memory에 보관하며, 없을 때 저장장치에서 읽습니다.

- question: Transaction은 Query 처리의 마지막에 한 번만 거치는 단계인가요?
  answer: 아니요. 여러 Query를 하나의 작업 범위로 묶어 Commit과 Rollback을 관리합니다.

- question: Lock은 여러 Transaction의 동시 접근을 어떻게 제어하나요?
  answer: 충돌하는 작업을 기다리게 하거나 실패시켜 데이터 변경 순서를 제어합니다.

- question: Database의 최대 Connection 수와 Application의 Connection Pool은 같은 것인가요?
  answer: 아니요. 최대 Connection 수는 Database Server의 동시 Connection 상한이고, Connection Pool은 Application이 Connection을 재사용하는 기능입니다.

