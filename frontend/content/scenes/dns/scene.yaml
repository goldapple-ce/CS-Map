title: DNS
summary: Client의 요청을 받은 Recursive Resolver가 Root, TLD와 Authoritative DNS의 위임을 따라 IP 주소를 찾아 반환합니다.
nodes:
  client:
    label: Client
    row: 3
    col: 1
    contentRef: client.ko.md
  recursive-resolver:
    label: Recursive Resolver
    row: 3
    col: 3
    contentRef: recursiveresolver.ko.md
  root-dns:
    label: Root DNS
    row: 1
    col: 5
    contentRef: rootdns.ko.md
  tld-dns:
    label: .com TLD DNS
    row: 3
    col: 5
    contentRef: tlddns.ko.md
  authoritative-dns:
    label: Authoritative DNS
    row: 5
    col: 5
    contentRef: authoritativedns.ko.md
edges:
  - from: client
    fromSide: right
    to: recursive-resolver
    toSide: left
    label: 1. DNS Query
  - from: recursive-resolver
    fromSide: top
    to: root-dns
    toSide: left
    label: 2. Root 질의
  - from: root-dns
    fromSide: left
    to: recursive-resolver
    toSide: top
    label: 3. .com TLD DNS 위치
    labelSide: bottom
  - from: recursive-resolver
    fromSide: right
    to: tld-dns
    toSide: left
    label: 4. TLD 질의
  - from: tld-dns
    fromSide: left
    to: recursive-resolver
    toSide: right
    label: 5. 권한 DNS 위치
    labelSide: bottom
  - from: recursive-resolver
    fromSide: bottom
    to: authoritative-dns
    # toSide: left
    label: 6. 권한 DNS 질의
    labelSide: bottom
  - from: authoritative-dns
    fromSide: left
    to: recursive-resolver
    toSide: bottom
    label: 7. A / AAAA Record
  - from: recursive-resolver
    fromSide: left
    to: client
    toSide: right
    label: 8. IP 주소 응답
    labelSide: bottom

lightFlows:
  dns-lookup:
    label: DNS 조회
    stages:
      - edges: [[client, recursive-resolver]]
      - edges: [[recursive-resolver, root-dns]]
      - edges: [[root-dns, recursive-resolver]]
      - edges: [[recursive-resolver, tld-dns]]
      - edges: [[tld-dns, recursive-resolver]]
      - edges: [[recursive-resolver, authoritative-dns]]
      - edges: [[authoritative-dns, recursive-resolver]]
      - edges: [[recursive-resolver, client]]
