- question: OSI 7계층에서 IP 주소를 이용해 목적지까지 데이터를 전달하는 계층은 어디인가요?
  answer: 네트워크 계층입니다. 라우터가 주로 동작하며, IP 주소 기반 라우팅을 담당합니다.

- question: OSI 7계층에서 MAC 주소를 이용해 같은 네트워크 내에서 데이터를 전달하는 계층은 어디인가요?
  answer: 데이터 링크 계층입니다. 스위치가 주로 동작하며, 프레임 단위 전달을 담당합니다.

- question: TCP와 UDP는 OSI 몇 계층에 해당하나요?
  answer: 전송 계층입니다. 포트 번호를 이용해 프로세스 간 통신을 담당합니다.

- question: HTTP는 OSI 몇 계층 프로토콜인가요?
  answer: 응용 계층입니다. 사용자가 직접 이용하는 웹 서비스를 위한 프로토콜입니다.

- question: 라우터와 스위치의 가장 큰 차이는 무엇인가요?
  answer: 라우터는 IP 주소를 기반으로 네트워크 간 패킷을 전달하고, 스위치는 MAC 주소를 기반으로 같은 네트워크 내부의 프레임을 전달합니다.

- question: OSI 7계층에서 데이터를 암호화하거나 압축하는 역할을 하는 계층은 어디인가요?
  answer: 표현 계층입니다. 데이터 형식 변환, 암호화, 압축 등을 담당합니다.

- question: 물리 계층에서는 데이터를 어떤 형태로 전달하나요?
  answer: 비트(Bit) 단위로 전달합니다. 전기 신호, 광 신호, 무선 신호 등 실제 전송 매체를 다룹니다.

- question: ARP는 OSI 몇 계층에서 동작한다고 볼 수 있나요?
  answer: 일반적으로 데이터 링크 계층과 네트워크 계층 사이에 위치한다고 봅니다. IP 주소를 MAC 주소로 변환하는 역할을 합니다.

- question: DNS는 OSI 몇 계층에 해당하나요?
  answer: 응용 계층입니다. 도메인 이름을 IP 주소로 변환하는 서비스를 제공합니다.

- question: 세션 계층(Session Layer)의 역할은 무엇인가요?
  answer: 두 애플리케이션 간의 연결을 관리합니다. 세션 생성, 유지, 종료 및 동기화를 담당합니다.

- question: 전송 계층에서 제공하는 대표적인 기능은 무엇인가요?
  answer: 신뢰성 있는 데이터 전달, 흐름 제어, 오류 제어, 포트 기반 프로세스 구분입니다.

- question: TCP와 UDP의 가장 큰 차이는 무엇인가요?
  answer: TCP는 연결 지향이며 신뢰성 있는 전송을 제공하고, UDP는 연결 과정 없이 빠른 데이터 전달을 우선합니다.

- question: 패킷(Packet)과 프레임(Frame)의 차이는 무엇인가요?
  answer: 패킷은 네트워크 계층의 데이터 단위이며 IP 정보를 포함하고, 프레임은 데이터 링크 계층의 데이터 단위이며 MAC 정보를 포함합니다.

- question: MAC 주소와 IP 주소의 차이는 무엇인가요?
  answer: MAC 주소는 네트워크 인터페이스를 식별하는 물리 주소이고, IP 주소는 네트워크에서 위치를 식별하는 논리 주소입니다.

- question: 스위치는 왜 MAC 주소 테이블을 가지고 있나요?
  answer: 목적지 MAC 주소를 보고 어느 포트로 프레임을 전달해야 하는지 판단하기 위해 사용합니다.

- question: 브라우저에서 google.com을 입력했을 때 OSI 계층 흐름은 어떻게 되나요?
  answer: 응용 계층(DNS, HTTP) → 전송 계층(TCP) → 네트워크 계층(IP) → 데이터 링크 계층(MAC) → 물리 계층(신호) 순서로 동작합니다.
