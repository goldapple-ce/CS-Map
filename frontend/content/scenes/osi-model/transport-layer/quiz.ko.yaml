- question: IP 주소와 Port 번호는 각각 무엇을 구분하나요?
  answer: IP 주소는 목적지 Host를 구분하고, Port 번호는 그 Host 안에서 통신할 Process를 구분합니다.

- question: Port 번호는 Application 자체의 이름인가요?
  answer: 아니요. 통신 Endpoint를 구분하기 위한 번호이며, 같은 Port를 어떤 Protocol과 Process가 사용할지는 설정에 따라 달라질 수 있습니다.

- question: TCP와 UDP는 차례로 실행되는 단계인가요?
  answer: 아니요. 통신 목적과 상위 Protocol에 따라 선택하는 서로 다른 Transport Layer Protocol입니다.

- question: UDP는 데이터의 도착과 순서를 자체적으로 보장하나요?
  answer: 아니요. UDP는 연결 수립 없이 Datagram을 전달하며 도착, 순서와 재전송을 자체적으로 보장하지 않습니다.

