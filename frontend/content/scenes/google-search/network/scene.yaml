id: google-search-network
slug: router
scenarioId: google-com
parentId: google-search-root
title: Router와 인터넷 경로
summary: 장치가 기본 게이트웨이의 링크 계층 주소를 확인하고 공유기와 ISP를 거쳐 목적지 네트워크로 packet을 전달하는 흐름입니다.
status: published
ariaLabel: 사용자 장치에서 기본 게이트웨이, ARP 또는 NDP, 공유기와 NAT, ISP, 인터넷 라우팅과 목적지 서버로 이어지는 흐름
layout: { type: grid, columns: 5, rows: 5 }
contentRef: content.ko.md
author:
  id: cs-map-team
  displayName: CS Map Team
updatedAt: 2026-07-25
sources:
  - title: RFC 826 — An Ethernet Address Resolution Protocol
    url: https://www.rfc-editor.org/rfc/rfc826.html
    type: primary
  - title: RFC 4861 — Neighbor Discovery for IPv6
    url: https://www.rfc-editor.org/rfc/rfc4861.html
    type: primary
  - title: RFC 3022 — Traditional IP Network Address Translator
    url: https://www.rfc-editor.org/rfc/rfc3022.html
    type: primary
  - title: RFC 4271 — A Border Gateway Protocol 4
    url: https://www.rfc-editor.org/rfc/rfc4271.html
    type: primary
contexts: []
occurrences: []
