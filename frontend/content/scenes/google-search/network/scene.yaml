    kind: node
    label: 기본 게이트웨이 선택
    grid: { row: 3, col: 2 }
  - id: neighbor-resolution
    kind: node
    label: ARP / NDP
    grid: { row: 3, col: 3 }
  - id: home-router-nat
    kind: node
    label: 공유기 / NAT
    grid: { row: 2, col: 4 }
  - id: isp
    kind: node
    label: ISP
    grid: { row: 4, col: 4 }
  - id: internet-routing
    kind: node
    label: 인터넷 라우팅
    grid: { row: 2, col: 5 }
  - id: destination-server
    kind: node
    label: 목적지 서버
    grid: { row: 4, col: 5 }
  - id: router-scope-note
    kind: annotation
    label: NAT는 모든 경로에 필수인 단계가 아니며, 가정용 IPv4 공유기를 사용하는 일반적인 예시로 표시합니다.
  - id: device-to-gateway
    kind: edge
    label: 다음 hop 선택
    fromElementId: user-device
    toElementId: default-gateway
  - id: gateway-to-neighbor
    kind: edge
    label: 링크 주소 확인
    fromElementId: default-gateway
    toElementId: neighbor-resolution
  - id: neighbor-to-router
    kind: edge
    label: frame 전달
    fromElementId: neighbor-resolution
    toElementId: home-router-nat
  - id: router-to-isp
    kind: edge
    label: 외부망 전달
    fromElementId: home-router-nat
    toElementId: isp
  - id: isp-to-internet
    kind: edge
    label: 경로 선택
    fromElementId: isp
    toElementId: internet-routing
  - id: internet-to-server
    kind: edge
    label: 목적지 network 도달
    fromElementId: internet-routing
    toElementId: destination-server
