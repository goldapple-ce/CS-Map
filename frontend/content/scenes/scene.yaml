title: google.com에 접속하는 전체 흐름
summary: Browser가 목적지 주소를 확인하고 Network를 통해 Server와 HTTPS 통신을 시작하는 전체 구조입니다.
nodes:
  user-device:
    label: 사용자 기기
    row: 3
    col: 2
    contentRef: user-device.ko.md
  browser:
    label: Browser
    row: 3
    col: 1
    contentRef: browser.ko.md
  tcp-ip:
    label: TCP/IP
    row: 2
    col: 3
    childSceneId: tcp-ip
  router:
    label: Router
    row: 3
    col: 3
    contentRef: router.ko.md
  dns:
    label: DNS
    row: 3
    col: 4
    childSceneId: dns
  router2:
    label: Router
    row: 2
    col: 4
    contentRef: router.ko.md
  server:
    label: Server
    row: 2
    col: 5
    childSceneId: server
edges:
  - from: browser
    fromSide: right
    to: user-device
    toSide: left
    label: 캐시 확인
    variant: supporting
  - from: user-device
    fromSide: right
    to: router
    toSide: left
    label: DNS 질의
  - from: router
    fromSide: right
    to: dns
    toSide: left
    label: IP 확인
  - from: browser
    fromSide: top
    to: tcp-ip
    toSide: left
    label: 서버 통신
  - from: tcp-ip
    to: router2
    label: Packet 전달
  - from: router2
    to: server
    label: 서버 전송
lightFlows:
  request-flow:
    label: 흐름보기
    stages:
      - edges:
          - [browser, user-device]
      - edges:
          - [user-device, router]
      - edges:
          - [router, dns]
      - edges:
          - [browser, tcp-ip]
      - edges:
          - [tcp-ip, router2]
      - edges:
          - [router2, server]
areas:
  user-device:
    label: 사용자 기기
    row: 3
    col: 1
    rowSpan: 1
    colSpan: 2
