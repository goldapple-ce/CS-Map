id: google-com-server-spring-security
summary: Servlet FilterChain에서 Spring Security의 FilterChainProxy와 SecurityFilterChain을 거쳐 허용된 요청이 DispatcherServlet로 전달되는 흐름입니다.
nodes:
  servlet-filter-chain:
    label: Servlet FilterChain
    row: 3
    col: 1
  delegating-filter-proxy:
