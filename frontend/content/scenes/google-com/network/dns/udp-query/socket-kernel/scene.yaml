id: google-search-dns-socket-kernel
summary: 사용자 프로세스가 Socket API로 UDP 전송을 요청하고 커널 네트워크 스택이 datagram을 처리하는 경계입니다.
nodes:
  resolver-process:
    label: Resolver 코드
    row: 3
    col: 1
  socket-descriptor:
    label: Socket file descriptor
    row: 3
    col: 2
  send-system-call:
    label: 전송 System Call
    row: 3
    col: 3
  kernel-socket-layer:
    label: Kernel Socket 계층
    row: 1
    col: 4
  udp-layer:
    label: UDP 계층
    row: 3
    col: 4
  ip-layer:
    label: IP 계층
    row: 5
    col: 4
  network-driver:
    label: Network Driver
    row: 3
    col: 5
edges:
  - from: resolver-process
    to: socket-descriptor
    label: socket 사용
  - from: socket-descriptor
    to: send-system-call
    label: 전송 요청
  - from: send-system-call
    to: kernel-socket-layer
    label: 사용자·커널 경계
  - from: kernel-socket-layer
    to: udp-layer
    label: datagram 처리
  - from: udp-layer
    to: ip-layer
    label: IP payload
  - from: ip-layer
    to: network-driver
    label: 송신 경로
