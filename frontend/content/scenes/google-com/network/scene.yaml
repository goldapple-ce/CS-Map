id: google-search-network
summary: 장치가 기본 게이트웨이의 링크 계층 주소를 확인하고 공유기와 ISP를 거쳐 목적지 네트워크로 packet을 전달하는 흐름입니다.
nodes:
  user-device:
    label: 사용자 장치
    row: 3
    col: 1
  default-gateway:
    label: 기본 게이트웨이 선택
    row: 3
    col: 2
  neighbor-resolution:
    label: ARP / NDP
    row: 3
    col: 3
  home-router-nat:
    label: 공유기 / NAT
    row: 2
    col: 4
  isp:
    label: ISP
    row: 4
    col: 4
  internet-routing:
    label: 인터넷 라우팅
    row: 2
    col: 5
  destination-server:
    label: 목적지 서버
    row: 4
    col: 5
edges:
  - from: user-device
    to: default-gateway
    label: 다음 hop 선택
  - from: default-gateway
    to: neighbor-resolution
    label: 링크 주소 확인
  - from: neighbor-resolution
    to: home-router-nat
    label: frame 전달
  - from: home-router-nat
    to: isp
    label: 외부망 전달
  - from: isp
    to: internet-routing
    label: 경로 선택
  - from: internet-routing
    to: destination-server
    label: 목적지 network 도달
