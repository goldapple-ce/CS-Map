- question: Browser에 google.com을 입력하면 곧바로 Google Server에 요청하나요?
  answer: 아니요. Cache된 IP 주소를 확인하고, 없으면 DNS에서 IP 주소를 얻은 뒤 Server 통신을 시작합니다.

- question: IP 주소가 Cache되어 있으면 무엇을 생략할 수 있나요?
  answer: 외부 DNS 조회를 생략할 수 있습니다. IP 주소를 이용한 Server 통신은 별도로 필요합니다.

- question: IP 주소에 대한 Cache는 어디에 있을 수 있나요?
  answer: Browser, 사용자 기기의 OS와 Recursive Resolver 등에 있을 수 있습니다.

- question: DNS Query도 HTTPS로 보내나요?
  answer: 아니요. 일반적으로는 DNS를 위한 별도의 통신 방식(DNS 프로토콜)을 사용합니다.

- question: DNS가 목적지 Server에 대신 요청을 보내나요?
  answer: 아니요. DNS는 IP 주소를 반환하고 Browser가 그 주소로 별도의 통신을 시작합니다.

- question: DNS Query와 Server 요청 모두 Router를 거치나요?
  answer: 네. 사용자 기기 밖으로 나가는 두 통신 모두 Router와 Network를 통해 전달됩니다.
